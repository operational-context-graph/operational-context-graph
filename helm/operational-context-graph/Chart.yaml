apiVersion: v2
name: operational-context-graph
description: Umbrella chart for the Operational Context Graph platform
type: application
version: 0.1.0
appVersion: "0.1.0"
dependencies:
  - name: data-ingestion
    version: 0.1.0
    condition: data-ingestion.enabled
  - name: postgres
    version: 0.1.0
    condition: postgres.enabled
  - name: pgadmin
    version: 0.1.0
    condition: pgadmin.enabled
  - name: doris-fe
    version: 0.1.0
    condition: doris-fe.enabled
  - name: doris-be
    version: 0.1.0
    condition: doris-be.enabled
  - name: telemetry-store
    version: 0.1.0
    condition: telemetry-store.enabled
