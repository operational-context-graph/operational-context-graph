enabled: true
replicaCount: 1

nameOverride: ""
fullnameOverride: ""

image:
  repository: ghcr.io/operational-context-graph/data-ingestion
  tag: "0.0.1"
  digest: ""
  pullPolicy: IfNotPresent

# Container ports
containerPort: 8080
grpcContainerPort: 9090
metricsPort: 8081

service:
  type: ClusterIP
  port: 8080
  grpcPort: 9090
  metricsPort: 8081

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

# tls configures mTLS for the gRPC server.
# Set enabled: true and provide a secretName referencing a Secret with:
#   tls.crt: server certificate PEM
#   tls.key: server private key PEM
#   ca.crt: CA certificate PEM used to verify client certificates
tls:
  enabled: false
  secretName: ""
  mountPath: /etc/tls

# PostgreSQL outbox connection
database:
  host: ""
  port: 5432
  name: ocg
  user: ocg
  sslmode: require
  maxconns: 10
  passwordSecret:
    name: ""
    key: password

# Downstream store base URLs.
telemetryStore:
  baseURL: "http://telemetry-store:8080"

inventoryStore:
  baseURL: "http://inventory-store:8080"

resources: {}
