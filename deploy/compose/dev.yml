# docker-compose for local development — inventory-store stack
# Uses upstream images — no build step needed.
# For production use the hardened images (see services/inventory-store/Dockerfile).
#
# Schema migrations are applied by the migrator service before inventory-store starts,
# mirroring the Kubernetes Job pattern used in production.

networks:
  inventory-ocg:
    driver: bridge

services:

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: inventory
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: dev-password-not-for-production
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "inventory"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - inventory-ocg

  migrator:
    image: ghcr.io/operational-context-graph/inventory-store-migrator:local
    environment:
      DATABASE_URL: "postgres://inventory:dev-password-not-for-production@postgres:5432/inventory?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - inventory-ocg

  inventory-store:
    image: ghcr.io/operational-context-graph/inventory-store:local
    environment:
      HTTP_PORT: "8080"
      LOG_LEVEL: "debug"
      DATABASE_URL: "postgres://inventory:dev-password-not-for-production@postgres:5432/inventory?sslmode=disable"
      DB_MAX_OPEN_CONNS: "25"
      DB_MAX_IDLE_CONNS: "5"
      DB_CONN_MAX_LIFETIME: "5m"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    networks:
      - inventory-ocg

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@local.dev
      PGADMIN_DEFAULT_PASSWORD: dev-password-not-for-production
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "8091:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - ./pgadmin-servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - inventory-ocg

volumes:
  postgres-data:
  pgadmin-data:
