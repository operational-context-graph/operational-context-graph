# Scans all dependency manifests in the repository using OSV-Scanner. Runs on
# every pull request targeting main.
# Docs: https://google.github.io/osv-scanner/github-action/
---
name: OSV-Scanner (PR)

on:
  pull_request:
    branches: ["main"]

jobs:
  osv-scan-pr:
    name: OSV-Scanner
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
    permissions:
      actions: read
      contents: read
      security-events: write
