# Fires on a component release tag push (services/**/vX.Y.Z). The tag is pushed by
# the tag-release job in ci.yml, after that run publishes the dev image for the
# squash-merged release PR. This workflow aliases the dev container image to the
# release version tag. No image build, no GitHub Release for components.
#
---
name: Release Component

on:
  push:
    tags:
      - "services/**/v*.*.*"

permissions:
  contents: read

jobs:
  detect:
    name: Detect Release
    runs-on: ubuntu-latest
    outputs:
      release_type: ${{ steps.parse.outputs.release_type }}
      component: ${{ steps.parse.outputs.component }}
      slug: ${{ steps.parse.outputs.slug }}
      version: ${{ steps.parse.outputs.version }}
      tag: ${{ steps.parse.outputs.tag }}
      has_dockerfile: ${{ steps.parse.outputs.has_dockerfile }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Parse release tag
        id: parse
        env:
          TAG_REF: ${{ github.ref_name }}
        run: scripts/parse-release-tag.sh "${TAG_REF}"
      - name: Log detected release
        env:
          RELEASE_TYPE: ${{ steps.parse.outputs.release_type }}
          SLUG: ${{ steps.parse.outputs.slug }}
          VERSION: ${{ steps.parse.outputs.version }}
          TAG: ${{ steps.parse.outputs.tag }}
        run: |
          if [ "${RELEASE_TYPE}" != "component" ]; then
            echo "Not a component release tag (type='${RELEASE_TYPE}'). Jobs will be skipped."
          else
            echo "release_type=${RELEASE_TYPE} slug=${SLUG} version=${VERSION} tag=${TAG}"
          fi

  retag-component-image:
    name: Retag Component Image to Release Version
    runs-on: ubuntu-latest
    needs: detect
    if: |
      needs.detect.outputs.release_type == 'component' &&
      needs.detect.outputs.has_dockerfile == 'true'
    permissions:
      contents: read
      packages: write  # required: crane tag retags the dev container image in GHCR to the release version
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/
          sparse-checkout-cone-mode: false
      - name: Install crane
        env:
          CRANE_VERSION: "v0.22.1"
          CRANE_SHA256: "0ab7a1d6932a213aed964ce97666c3077fe691c8606413674a8b3e0b9ec4cda0"
        run: scripts/install-crane.sh "${CRANE_VERSION}" "${CRANE_SHA256}"
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Retag dev image to release version
        env:
          REGISTRY: ghcr.io/${{ github.repository_owner }}
          SLUG: ${{ needs.detect.outputs.slug }}
          VERSION: ${{ needs.detect.outputs.version }}
          HEAD_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          COMMIT_DATE=$(gh api "repos/${REPO}/commits/${HEAD_SHA}" \
            --jq '.commit.committer.date' \
            | cut -c1-10 \
            | tr -d '-')
          DEV_TAG="dev.${COMMIT_DATE}-${HEAD_SHA:0:7}"
          src="${REGISTRY}/${SLUG}:${DEV_TAG}"
          ~/.local/bin/crane tag "${src}" "${VERSION}"
          ~/.local/bin/crane tag "${src}" "${VERSION}-${HEAD_SHA:0:7}"
          echo "Retagged ${src} → ${VERSION}, ${VERSION}-${HEAD_SHA:0:7}"
