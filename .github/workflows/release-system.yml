# Fires on a system release tag push (vX.Y.Z). The tag is pushed by merge-gate.yml
# after a system release PR squash-merges to main. This workflow aliases the dev
# Helm chart to the release version, re-versions and signs the OCM bundle, and
# creates a GitHub Release with the Helm chart and OCM CTF archive attached.
#
---
name: Release System

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: read

jobs:
  detect:
    name: Detect Release
    runs-on: ubuntu-latest
    outputs:
      release_type: ${{ steps.parse.outputs.release_type }}
      version: ${{ steps.parse.outputs.version }}
      tag: ${{ steps.parse.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Parse release tag
        id: parse
        env:
          TAG_REF: ${{ github.ref_name }}
        run: scripts/parse-release-tag.sh "${TAG_REF}"
      - name: Log detected release
        env:
          RELEASE_TYPE: ${{ steps.parse.outputs.release_type }}
          VERSION: ${{ steps.parse.outputs.version }}
          TAG: ${{ steps.parse.outputs.tag }}
        run: |
          if [ "${RELEASE_TYPE}" != "system" ]; then
            echo "Not a system release tag (type='${RELEASE_TYPE}'). Jobs will be skipped."
          else
            echo "release_type=${RELEASE_TYPE} version=${VERSION} tag=${TAG}"
          fi

  alias-release-artifacts:
    name: Alias Release Artifacts to Release Version
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.release_type == 'system'
    permissions:
      contents: read
      packages: write # required: crane tag retags the dev Helm chart in GHCR to the release version
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/
          sparse-checkout-cone-mode: false
      - name: Install crane
        env:
          CRANE_VERSION: "v0.22.1"
          CRANE_SHA256: "0ab7a1d6932a213aed964ce97666c3077fe691c8606413674a8b3e0b9ec4cda0"
        run: scripts/install-crane.sh "${CRANE_VERSION}" "${CRANE_SHA256}"
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Alias dev Helm chart to release version
        env:
          REGISTRY: ghcr.io/${{ github.repository_owner }}
          VERSION: ${{ needs.detect.outputs.version }}
          HEAD_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          COMMIT_DATE=$(gh api "repos/${REPO}/commits/${HEAD_SHA}" \
            --jq '.commit.committer.date' \
            | cut -c1-10 \
            | tr -d '-')
          DEV_TAG="0.0.0-dev.${COMMIT_DATE}-${HEAD_SHA:0:7}"
          src="${REGISTRY}/charts/operational-context-graph:${DEV_TAG}"
          ~/.local/bin/crane tag "${src}" "${VERSION}"
          echo "Aliased Helm chart ${src} → ${VERSION}"

  # ─────────────────────────────────────────────────────────────────────────────
  # OCM Bundle: re-version the dev CTF from GHCR to the release version.
  # Downloads the CI-built dev bundle (same image content as tested), extracts
  # resources, rebuilds CTF at release version, signs, and pushes to GHCR.
  # This avoids re-pulling service images from the registry.
  # ─────────────────────────────────────────────────────────────────────────────
  ocm-bundle:
    name: OCM Bundle
    runs-on: ubuntu-latest
    needs: [detect]
    if: needs.detect.outputs.release_type == 'system'
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.detect.outputs.version }}
      OCM_VERSION: "0.22.1"
      OCM_CLI_SHA256: "15532daec120686519dc3d122e078820114f2bd090b1ed3091e9bea6704339ca"
      REGISTRY: ghcr.io/${{ github.repository_owner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: "v${{ needs.detect.outputs.version }}"
          fetch-depth: 0
          persist-credentials: false

      - name: Install OCM v2 CLI
        run: |
          curl -fsSL \
            "https://github.com/open-component-model/open-component-model/releases/download/v${OCM_VERSION}/ocm-linux-amd64" \
            -o /tmp/ocm-bin
          echo "${OCM_CLI_SHA256}  /tmp/ocm-bin" | sha256sum --check --status || {
            echo "ERROR: OCM CLI checksum mismatch"
            sha256sum /tmp/ocm-bin
            exit 1
          }
          install -m 0755 /tmp/ocm-bin /usr/local/bin/ocm
          ocm version

      - name: Set up Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0

      - name: Install tools (yq)
        env:
          YQ_VERSION: "v4.44.6"
          YQ_SHA256: "0c2b24e645b57d8e7c0566d18643a6d4f5580feeea3878127354a46f2a1e4598"
        run: |
          curl -fsSL "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64" \
            -o /tmp/yq
          echo "${YQ_SHA256}  /tmp/yq" | sha256sum -c -
          install -m 0755 /tmp/yq /usr/local/bin/yq

      - name: Write signing key
        env:
          OCM_SIGNING_KEY: ${{ secrets.OCM_SIGNING_KEY }}
        run: |
          printf '%s' "${OCM_SIGNING_KEY}" > /tmp/ocg-signing-key.pem
          chmod 600 /tmp/ocg-signing-key.pem

      - name: Resolve dev bundle version
        id: dev-version
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          COMMIT_DATE=$(gh api "repos/${REPO}/commits/${HEAD_SHA}" \
            --jq '.commit.committer.date' \
            | cut -c1-10 \
            | tr -d '-')
          DEV_VERSION="0.0.0-dev.${COMMIT_DATE}-${HEAD_SHA:0:7}"
          echo "dev_version=${DEV_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved dev bundle version: ${DEV_VERSION}"

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Release preflight
        run: VERSION="${VERSION}" make ocm-release-preflight

      - name: Re-version, sign, and verify OCM bundle
        env:
          DEV_VERSION: ${{ steps.dev-version.outputs.dev_version }}
        run: |
          SIGN_KEY=/tmp/ocg-signing-key.pem \
            scripts/ocm-reversion.sh "${DEV_VERSION}" "${VERSION}" "${REGISTRY}"

      - name: Push CTF to GHCR as OCI
        run: |
          ocm transfer component-version \
            ctf::./bin/ctf// \
            "oci::${REGISTRY}/ocm"

      - name: Upload OCM CTF artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ocg-ctf-${{ needs.detect.outputs.version }}
          path: bin/ocg-${{ needs.detect.outputs.version }}.ctf.tgz
          retention-days: 30

  pull-helm-chart:
    name: Pull Helm Chart from OCI
    runs-on: ubuntu-latest
    needs: [detect, alias-release-artifacts]
    if: needs.detect.outputs.release_type == 'system'
    permissions:
      contents: read
      packages: read
    steps:
      - name: Set up Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull Helm chart from OCI registry
        env:
          VERSION: ${{ needs.detect.outputs.version }}
          REGISTRY: ghcr.io/${{ github.repository_owner }}
        run: |
          helm pull \
            "oci://${REGISTRY}/charts/operational-context-graph" \
            --version "${VERSION}"
          ls -la "operational-context-graph-${VERSION}.tgz"
      - name: Upload Helm chart artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ocg-helm-${{ needs.detect.outputs.version }}
          path: operational-context-graph-${{ needs.detect.outputs.version }}.tgz
          retention-days: 1

  generate-system-release-notes:
    name: Generate System Release Notes
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.release_type == 'system'
    permissions:
      contents: read
    outputs:
      notes: ${{ steps.notes.outputs.notes }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: "v${{ needs.detect.outputs.version }}"
          persist-credentials: false
          fetch-depth: 0
      - name: Build release notes
        id: notes
        env:
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          NOTES=$(scripts/extract-release-notes.sh "${VERSION}" CHANGELOG.md)
          printf 'notes<<EOF\n%s\nEOF\n' "${NOTES}" >> "$GITHUB_OUTPUT"

  github-release-system:
    name: Create System GitHub Release
    needs: [detect, pull-helm-chart, ocm-bundle, generate-system-release-notes]
    if: needs.detect.outputs.release_type == 'system'
    uses: $/.github/workflows/create-github-release.yml
    with:
      tag: "v${{ needs.detect.outputs.version }}"
      title: "system v${{ needs.detect.outputs.version }}"
      notes: ${{ needs.generate-system-release-notes.outputs.notes }}
      artifacts: |
        ocg-helm-${{ needs.detect.outputs.version }}:operational-context-graph-${{ needs.detect.outputs.version }}.tgz#Helm chart
        ocg-ctf-${{ needs.detect.outputs.version }}:ocg-${{ needs.detect.outputs.version }}.ctf.tgz#OCM bundle
      client_id: ${{ vars.APP_CLIENT_ID }}
    secrets:
      private_key: ${{ secrets.APP_PRIVATE_KEY }}
