# Fires on a system release tag push (vX.Y.Z). The tag is pushed by the
# tag-release job in ci.yml, after that run publishes the dev Helm chart for
# the squash-merged release PR. This workflow aliases the dev Helm chart to the
# release version, pulls it, and creates a GitHub Release with the chart attached.
# No container image build, no Helm chart repackaging.
#
---
name: Release System

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: read

jobs:
  detect:
    name: Detect Release
    runs-on: ubuntu-latest
    outputs:
      release_type: ${{ steps.parse.outputs.release_type }}
      version: ${{ steps.parse.outputs.version }}
      tag: ${{ steps.parse.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Parse release tag
        id: parse
        env:
          TAG_REF: ${{ github.ref_name }}
        run: scripts/parse-release-tag.sh "${TAG_REF}"
      - name: Log detected release
        env:
          RELEASE_TYPE: ${{ steps.parse.outputs.release_type }}
          VERSION: ${{ steps.parse.outputs.version }}
          TAG: ${{ steps.parse.outputs.tag }}
        run: |
          if [ "${RELEASE_TYPE}" != "system" ]; then
            echo "Not a system release tag (type='${RELEASE_TYPE}'). Jobs will be skipped."
          else
            echo "release_type=${RELEASE_TYPE} version=${VERSION} tag=${TAG}"
          fi

  retag-release-artifacts:
    name: Retag Release Artifacts to Release Version
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.release_type == 'system'
    permissions:
      contents: read
      packages: write # required: crane tag retags the dev Helm chart in GHCR to the release version
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/
          sparse-checkout-cone-mode: false
      - name: Install crane
        env:
          CRANE_VERSION: "v0.22.1"
          CRANE_SHA256: "0ab7a1d6932a213aed964ce97666c3077fe691c8606413674a8b3e0b9ec4cda0"
        run: scripts/install-crane.sh "${CRANE_VERSION}" "${CRANE_SHA256}"
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Retag dev Helm chart to release version
        env:
          REGISTRY: ghcr.io/${{ github.repository_owner }}
          VERSION: ${{ needs.detect.outputs.version }}
          HEAD_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          COMMIT_DATE=$(gh api "repos/${REPO}/commits/${HEAD_SHA}" \
            --jq '.commit.committer.date' \
            | cut -c1-10 \
            | tr -d '-')
          DEV_TAG="0.0.0-dev.${COMMIT_DATE}-${HEAD_SHA:0:7}"
          src="${REGISTRY}/operational-context-graph:${DEV_TAG}"
          ~/.local/bin/crane tag "${src}" "${VERSION}"
          echo "Retagged Helm chart ${src} → ${VERSION}"
          # TODO: retag OCM bundle when publish-ocm-bundle is implemented

  pull-helm-chart:
    name: Pull Helm Chart from OCI
    runs-on: ubuntu-latest
    needs: [detect, retag-release-artifacts]
    if: needs.detect.outputs.release_type == 'system'
    permissions:
      contents: read
      packages: read
    steps:
      - name: Set up Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull Helm chart from OCI registry
        env:
          VERSION: ${{ needs.detect.outputs.version }}
          REGISTRY: ghcr.io/${{ github.repository_owner }}
        run: |
          helm pull \
            "oci://${REGISTRY}/operational-context-graph" \
            --version "${VERSION}"
          ls -la "operational-context-graph-${VERSION}.tgz"
      - name: Upload Helm chart artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ocg-helm-${{ needs.detect.outputs.version }}
          path: operational-context-graph-${{ needs.detect.outputs.version }}.tgz
          retention-days: 1

  generate-system-release-notes:
    name: Generate System Release Notes
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.release_type == 'system'
    permissions:
      contents: read
    outputs:
      notes: ${{ steps.notes.outputs.notes }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: "v${{ needs.detect.outputs.version }}"
          persist-credentials: false
          fetch-depth: 0
      - name: Build release notes
        id: notes
        env:
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          NOTES=$(scripts/extract-release-notes.sh "${VERSION}" CHANGELOG.md)
          echo "Extracted release notes for v${VERSION}:"
          echo "${NOTES}"
          printf 'notes<<EOF\n%s\nEOF\n' "${NOTES}" >> "$GITHUB_OUTPUT"

  github-release-system:
    name: Create System GitHub Release
    needs: [detect, pull-helm-chart, generate-system-release-notes]
    if: needs.detect.outputs.release_type == 'system'
    uses: $/.github/workflows/create-github-release.yml
    with:
      tag: "v${{ needs.detect.outputs.version }}"
      title: "system v${{ needs.detect.outputs.version }}"
      notes: ${{ needs.generate-system-release-notes.outputs.notes }}
      artifacts: |
        ocg-helm-${{ needs.detect.outputs.version }}:operational-context-graph-${{ needs.detect.outputs.version }}.tgz#Helm chart
      client_id: ${{ vars.APP_CLIENT_ID }}
    secrets:
      private_key: ${{ secrets.APP_PRIVATE_KEY }}
