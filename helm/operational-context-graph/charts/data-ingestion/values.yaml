# Default values for the data-ingestion subchart.
enabled: true
replicaCount: 1

image:
  repository: ghcr.io/operational-context-graph/data-ingestion
  tag: "0.1.0"
  pullPolicy: IfNotPresent

# Container port the service listens on (matches OCG_DI_SERVER_PORT default).
containerPort: 8080

service:
  type: ClusterIP
  port: 8080

# PostgreSQL outbox connection. The password is never set here; it is read from
# a Kubernetes Secret via passwordSecret. For local/dev the umbrella chart points
# these at the bundled postgres subchart; for prod they point at the existing OCG
# instance.
database:
  host: ""
  port: 5432
  name: ocg
  user: ocg
  sslmode: require
  maxconns: 10
  outboxtable: data_ingestion_outbox
  passwordSecret:
    name: ""
    key: password

resources: {}

nameOverride: ""
fullnameOverride: ""
