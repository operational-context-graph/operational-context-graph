# Dev / demo values — upstream images, single instances, no HA
# These are intentionally relaxed. See values-prod.yaml for production settings.

# Target namespace — set to the namespace you deploy into (e.g. autonomous-operations)
namespace: "<namespace>"

# Container registry — set to your registry prefix (e.g. keppel.eu-de-1.cloud.sap/ccloud)
registry: "<registry>"

# Labels applied to every resource — set to your org's service and support-group values
labels:
  service: operational-context-graph
  supportGroup: "<support-group>"

# Log level for all application components (debug, info, warn, error)
logLevel: "info"

inventoryStore:
  image: operational-context-graph-inventory-store
  tag: latest
  replicas: 1
  port: 8080

telemetryStore:
  image: operational-context-graph-telemetry-store
  tag: latest
  replicas: 1
  port: 8080

dataIngestion:
  image: operational-context-graph-data-ingestion
  tag: latest
  replicas: 1
  port: 8080

postgres:
  # Dev uses upstream image — no build step needed
  image: postgres
  tag: "16"
  storage: 10Gi
  database: inventory
  user: inventory

doris:
  # Dev uses upstream images — no build step needed
  writerUser: ocg_writer
  fe:
    image: apache/doris
    tag: fe-4.1.4
    replicas: 1
    httpPort: 8030
    mysqlPort: 9030
    thriftPort: 9020
    bdbPort: 9010
    storage: 10Gi
  be:
    image: apache/doris
    tag: be-4.1.4
    replicas: 1
    httpPort: 8040
    heartbeatPort: 9050
    thriftPort: 9060
    brpcPort: 8060
    storage: 50Gi
