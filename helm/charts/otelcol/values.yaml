enabled: true
replicaCount: 1

nameOverride: ""
fullnameOverride: ""

image:
  repository: otel/opentelemetry-collector
  tag: "0.166.0@sha256:5dfb40297a8da893e4e9b6b98d3ddbdd9082f73611170d6381e355e08b235334"
  digest: ""
  pullPolicy: IfNotPresent

# Port the collector listens on for OTLP/HTTP.
containerPort: 4318
metricsPort: 8081

service:
  type: ClusterIP
  port: 4318
  metricsPort: 8081

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

# Endpoint of the data-ingestion gRPC receiver (OTLP/gRPC, no TLS).
dataIngestionEndpoint: "ocg-data-ingestion:9090"

resources: {}
