# docker-compose for local development — telemetry-store stack
# Uses upstream images — no build step needed.
# For production use the hardened images (see infrastructure/ Dockerfiles).
#
# Fixed subnet 172.28.0.0/16 gives Doris stable IPs so FE_SERVERS / BE_SERVERS
# can be set without dynamic IP lookups.
#
# First-time setup — apply Doris users after the stack is healthy:
#   docker compose -f dev.yml exec doris-fe mysql -h 127.0.0.1 -P 9030 -u root < ../sql/doris-users.sql
#
# Schema migrations run automatically via the telemetry-store-migrate service.

networks:
  ocg:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

services:

  # macOS (Docker Desktop): sets vm.max_map_count in the Docker Linux VM — required by Doris BE.
  # Linux: remove this service and run `sudo sysctl -w vm.max_map_count=2000000` on the host instead.
  sysctl-init:
    image: alpine
    privileged: true
    command: sysctl -w vm.max_map_count=2000000
    restart: "no"
    networks:
      - ocg

  doris-fe:
    image: apache/doris:fe-4.1.4
    environment:
      # Election mode — single FE node (fe1) acting as master
      FE_SERVERS: "fe1:172.28.1.1:9010"
      FE_ID: "1"
    ports:
      - "8030:8030"
      - "9030:9030"
    volumes:
      - doris-fe-meta:/opt/apache-doris/fe/doris-meta
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8030/api/bootstrap"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      ocg:
        ipv4_address: 172.28.1.1

  doris-be:
    image: apache/doris:be-4.1.4
    environment:
      # Points BE to the FE master
      FE_SERVERS: "fe1:172.28.1.1:9010"
      BE_ADDR: "172.28.1.2:9050"
    ports:
      - "8040:8040"
      - "9050:9050"
    volumes:
      - doris-be-storage:/opt/apache-doris/be/storage
      - ../../infrastructure/doris/be.conf:/opt/apache-doris/be/conf/be.conf
    depends_on:
      doris-fe:
        condition: service_healthy
      sysctl-init:
        condition: service_completed_successfully
    networks:
      ocg:
        ipv4_address: 172.28.1.2

  telemetry-store-migrate:
    image: ghcr.io/operational-context-graph/telemetry-store-migrator:local
    environment:
      DORIS_DSN: "root:@tcp(doris-fe:9030)/"
      REPLICATION_NUM: "1"
      BUCKETS: "1"
    restart: "no"
    depends_on:
      doris-fe:
        condition: service_healthy
    networks:
      - ocg

  telemetry-store:
    image: ghcr.io/operational-context-graph/telemetry-store:local
    environment:
      HTTP_PORT: "8081"
      LOG_LEVEL: "debug"
      DORIS_DSN: "ocg_reader:dev-password-not-for-production@tcp(doris-fe:9030)/ocg"
      DORIS_STREAM_LOAD_URL: "http://doris-fe:8030"
      DORIS_STREAM_LOAD_USER: "ocg_writer"
      DORIS_STREAM_LOAD_PASSWORD: "dev-password-not-for-production"
    ports:
      - "8081:8081"
    depends_on:
      doris-fe:
        condition: service_healthy
      telemetry-store-migrate:
        condition: service_completed_successfully
    networks:
      - ocg

volumes:
  doris-fe-meta:
  doris-be-storage:
