# Local/dev overrides.
# Create the secret before deploying:
#   kubectl create secret generic postgres-secret --from-literal=password=<your-password>

postgresql:
  primary:
    persistence:
      size: 1Gi

inventory-store:
  image:
    repository: localhost:5001/inventory-store
    tag: local
    pullPolicy: Always
  database:
    host: ocg-postgresql
    sslmode: disable
    passwordSecret:
      name: postgres-secret
      key: password

telemetry-store:
  image:
    repository: localhost:5001/telemetry-store
    tag: local
    pullPolicy: Always
  env:
    DORIS_REPLICATION_NUM: "1"

data-ingestion:
  image:
    repository: localhost:5001/data-ingestion
    tag: local
    pullPolicy: Always
  database:
    host: ocg-postgresql
    name: data_ingestion
    sslmode: disable
    passwordSecret:
      name: postgres-secret
      key: password
  inventoryStore:
    baseURL: "http://ocg-inventory-store:8080"
  telemetryStore:
    baseURL: "http://ocg-telemetry-store:8080"

inventory-connector:
  enabled: true
  image:
    repository: localhost:5001/inventory-connector
    tag: local
    pullPolicy: Always
  netbox:
    baseURL: "http://host.docker.internal:8081"
    pageSize: 1000
    tokenSecret:
      name: netbox-token
      key: token
  grpc:
    endpoint: "ocg-data-ingestion:9090"
    connectorID: "ocg-inventory-connector"
  connector:
    schemaVersion: "0.1.0"
    endpoints:
      - "dcim/devices/"

otelcol:
  enabled: true
  fullnameOverride: otelcol
  dataIngestionEndpoint: "ocg-data-ingestion:9090"

doris:
  feSpec:
    requests:
      cpu: "1"
      memory: 3Gi
    limits:
      cpu: "2"
      memory: 4Gi
  beSpec:
    requests:
      cpu: "1"
      memory: 3Gi
    limits:
      cpu: "2"
      memory: 4Gi
