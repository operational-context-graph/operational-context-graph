# Local/dev overrides for a single-node development cluster.
#
# Prerequisites before helm install:
#   1. Doris Operator installed separately (cluster-scoped, not bundled here):
#        helm install doris-operator \
#          oci://registry-1.docker.io/selectdb/doris-operator \
#          --version 25.8.0 --namespace doris-operator --create-namespace
#   2. vm.max_map_count >= 2000000 on each node:
#        sudo sysctl -w vm.max_map_count=2000000
#   3. Kubernetes Secrets created — see README.md for the full list.
#
# This file is committed as a dev-environment example. It does NOT contain secrets.
# Sensitive overrides (netbox.baseURL, token values, etc.) belong in a gitignored file
# layered on top: helm install ... -f values.local.yaml -f values.secret.yaml

postgresql:
  enabled: true
  primary:
    persistence:
      size: 1Gi

data-ingestion:
  image:
    repository: localhost:5001/data-ingestion
    tag: local
    pullPolicy: Always

inventory-store:
  enabled: true
  replicaCount: 1
  image:
    repository: localhost:5001/inventory-store
    tag: local
    pullPolicy: Always
  database:
    host: ocg-postgresql
    sslmode: disable
    passwordSecret:
      name: postgres-secret
      key: password

telemetry-store:
  enabled: true
  replicaCount: 1
  image:
    repository: localhost:5001/telemetry-store
    tag: local
    pullPolicy: Always
  env:
    DORIS_REPLICATION_NUM: "1"

inventory-connector:
  enabled: true
  image:
    repository: localhost:5001/inventory-connector
    tag: local
    pullPolicy: Always
  netbox:
    baseURL: "http://<your-mockreplay-host>:8081"
    pageSize: 1000

otelcol:
  enabled: true

doris:
  enabled: true
  feSpec:
    requests:
      cpu: "0.5"
      memory: 1Gi
    limits:
      cpu: "1"
      memory: 2Gi
    config: |
      meta_dir = /opt/apache-doris/fe/doris-meta
      priority_networks = 10.0.0.0/8
      http_port = 8030
      rpc_port = 9020
      query_port = 9030
      edit_log_port = 9010
      # Heap must fit within the 2Gi container limit
      JAVA_OPTS_FOR_JDK_17 = "-Xmx1024m -Xms1024m"
      query_timeout = 300
      stream_load_default_timeout_second = 600
      enable_fqdn_mode = true
  beSpec:
    requests:
      cpu: "0.5"
      memory: 2Gi
    limits:
      cpu: "1"
      memory: 4Gi
    config: |
      storage_root_path = /opt/apache-doris/be/storage
      priority_networks = 10.0.0.0/8
      be_port = 9060
      webserver_port = 8040
      heartbeat_service_port = 9050
      brpc_port = 8060
      cumulative_compaction_num_threads_per_disk = 2
      base_compaction_num_threads_per_disk = 1
      max_compaction_threads = 10
      mem_limit = 70%
      streaming_load_max_mb = 10240

pgadmin:
  enabled: true
