global: {}

# Bundled PostgreSQL.
postgres:
  enabled: true

data-ingestion:
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/operational-context-graph/data-ingestion
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8080
  # Points at the existing OCG PostgreSQL instance. Set host and the Secret that
  # holds the password for your environment. The password is never stored here.
  database:
    host: ocg-postgres
    port: 5432
    name: postgres
    user: postgres
    sslmode: disable
    maxconns: 10
    passwordSecret:
      name: postgres-secret
      key: POSTGRES_PASSWORD
