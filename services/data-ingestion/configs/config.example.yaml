# Example configuration for the Data Ingestion service.
# Copy and adjust per environment. Values are overridden by OCG_DI_* env vars,
# e.g. OCG_DI_SERVER_PORT or OCG_DI_LOGGING_LEVEL.
server:
  host: 0.0.0.0
  port: 8080
logging:
  level: info
database:
  host: localhost
  port: 5432
  name: ocg
  user: ocg
  sslmode: disable
  maxconns: 10
  # The password is NOT configured here. Supply it via the
  # OCG_DI_DATABASE__PASSWORD environment variable (sourced from a Secret).
