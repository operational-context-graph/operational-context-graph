global: {}

postgresql:
  enabled: true
  auth:
    existingSecret: postgres-secret
    secretKeys:
      adminPasswordKey: password
    username: ocg
    database: ocg
  primary:
    persistence:
      size: 10Gi
      storageClass: ""
    extendedConfiguration: |
      password_encryption = scram-sha-256

pgadmin:
  enabled: false
  image:
    repository: dpage/pgadmin4
    tag: "9@sha256:c332c5f6dfba995d9ebc4af261d93506d6876085d712eaaa3defc8dd1a3f26de"
    pullPolicy: IfNotPresent
  secretName: pgadmin-secret
  service:
    port: 80

data-ingestion:
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/operational-context-graph/data-ingestion
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8080
  database:
    host: ocg-postgresql
    port: 5432
    name: ocg
    user: ocg
    sslmode: disable
    maxconns: 10
    passwordSecret:
      name: postgres-secret
      key: password
  telemetryStore:
    baseURL: "http://ocg-telemetry-store:8080"
  inventoryStore:
    baseURL: "http://ocg-inventory-store:8080"


telemetry-store:
  enabled: true
  replicaCount: 3
  env:
    # Set to "1" in values.local.yaml for a single-BE dev cluster.
    DORIS_REPLICATION_NUM: "3"

doris:
  enabled: true

  # Doris Operator watches this DorisCluster resource and creates the
  # StatefulSet, Service, and PVC resources for FE and BE.
  # Override image tags to pin to a specific Doris release.
  feSpec:
    replicas: 1
    image: apache/doris:fe-4.1.4@sha256:3cbfc9b6293057a0b7f10c2e597f20f4a6bafed0729dfa9795db21eae2e136bb
    requests:
      cpu: "2"
      memory: 4Gi
    limits:
      cpu: "4"
      memory: 8Gi
    persistentVolumes:
      - mountPath: /opt/apache-doris/fe/doris-meta
        name: fe-meta
        persistentVolumeClaimSpec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 5Gi
      - mountPath: /opt/apache-doris/fe/log
        name: fe-log
        persistentVolumeClaimSpec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 5Gi
    config:
      metaDir: /opt/apache-doris/fe/doris-meta
      priorityNetworks: 10.0.0.0/8
      httpPort: 8030
      rpcPort: 9020
      queryPort: 9030
      editLogPort: 9010
      javaOpts: "-Xmx4096m -Xms4096m"
      queryTimeout: 300
      streamLoadTimeout: 600

  beSpec:
    replicas: 1
    image: apache/doris:be-4.1.4@sha256:08c139f3d0ec45090a5214fd76f19f84b871d05f1a2db83b5e35a85c193617b2
    requests:
      cpu: "4"
      memory: 8Gi
    limits:
      cpu: "8"
      memory: 16Gi
    persistentVolumes:
      - mountPath: /opt/apache-doris/be/storage
        name: be-storage
        persistentVolumeClaimSpec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 20Gi
      - mountPath: /opt/apache-doris/be/log
        name: be-log
        persistentVolumeClaimSpec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 5Gi
    config:
      storageRootPath: /opt/apache-doris/be/storage
      priorityNetworks: 10.0.0.0/8
      bePort: 9060
      webserverPort: 8040
      heartbeatServicePort: 9050
      brpcPort: 8060
      cumulativeCompactionThreads: 2
      baseCompactionThreads: 1
      maxCompactionThreads: 10
      memLimit: "90%"
      streamingLoadMaxMb: 10240

inventory-connector:
  enabled: true
  image:
    repository: ghcr.io/operational-context-graph/inventory-connector
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  netbox:
    # Required: no default. Must be provided per environment, e.g. in values.local.yaml.
    # baseURL: "http://your-netbox"
    tokenSecret:
      name: "netbox-token"
      key: token
  grpc:
    endpoint: "ocg-data-ingestion:9090"
    connectorID: "ocg-inventory-connector"
  connector:
    schemaVersion: "0.1.0"
    endpoints:
      - "dcim/devices/"

otelcol:
  enabled: true
  fullnameOverride: otelcol
  dataIngestionEndpoint: "ocg-data-ingestion:9090"
