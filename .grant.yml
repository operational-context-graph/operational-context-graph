# Grant License Compliance Configuration
# Complete configuration file with all available options
# See: https://github.com/anchore/grant

format: table
quiet: false
verbose: true

require-license: true
require-known-license: false

allow:
  - 0BSD
  - Apache-*
  - BSD-*-Clause
  - BSD-2-Clause-Patent
  - BSD-2-Clause-FreeBSD
  - BSD-2-Clause-NetBSD
  - BSD-2-Clause-Views
  - BSD-3-Clause-Attribution
  - BSD-3-Clause-Clear
  - BSD-3-Clause-Modification
  - ISC
  - MIT
  - MIT-Modern-Variant
  - Unlicense
  - Zlib
  - CC0-*
  - BSL-1.0

ignore-packages:
  # Note: Syft's SBOM does currently not contain license information for GitHub Actions
  - github/codeql-action/* # MIT
  - amannn/action-semantic-pull-request # MIT
  - fsfe/reuse-action # CC0-1.0
  - golangci/golangci-lint-action # MIT
  - golang/govulncheck-action # BSD-3-Clause
  - marocchino/sticky-pull-request-comment # MIT
  - ossf/scorecard-action # Apache-2.0
  - anchore/sbom-action # Apache-2.0
  - anchore/scan-action # MIT
  - pnpm/action-setup # MIT
  - zizmorcore/zizmor-action # MIT
  - bufbuild/buf-action # Apache-2.0

  # Go packages
  - github.com/grpc-ecosystem/grpc-gateway/v2 # BSD-3-Clause
  - github.com/opencontainers/go-digest # Apache-2.0, documentation under CC-BY-SA-4.0, but Syft only finds CC-BY-SA-4.0
  - dario.cat/mergo # BSD-3-Clause
  - github.com/jackc/pgx/v5 # MIT
  - github.com/moby/patternmatcher # Apache-2.0
  - github.com/piprate/json-gold # Apache-2.0
  - github.com/quic-go/quic-go # MIT

  # Node.js package manager
  - pnpm # MIT
  - "@pnpm/exe.*" # platform-specific binary distributions that lack SPDX metadata in the SBOM

  # Exclude github.com/operational-context-graph/* due to being our own packages
  - github.com/operational-context-graph/*
