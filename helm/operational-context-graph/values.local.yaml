# Local/dev overrides: bundle a throwaway PostgreSQL and point the service at it.
postgres:
  enabled: true
  fullnameOverride: ocg-postgres
  secretName: postgres-secret
  # Password is never stored here. Create the secret once before deploying:
  #   kubectl create secret generic postgres-secret --from-literal=POSTGRES_PASSWORD=<your-password>

data-ingestion:
  image:
    repository: data-ingestion
    tag: dev
    pullPolicy: Never

inventory-connector:
  enabled: true
  image:
    repository: inventory-connector
    tag: dev
    pullPolicy: Never
  netbox:
    baseURL: "http://mockreplay-netbox:8081"
    pageSize: 1000
    tokenSecret:
      name: netbox-token
      key: token
  grpc:
    endpoint: "ocg-data-ingestion:9090"
    connectorID: "ocg-inventory-connector"
  connector:
    schemaVersion: "0.1.0"
    endpoints:
      - "dcim/devices/"
