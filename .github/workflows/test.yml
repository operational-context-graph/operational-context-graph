---
name: Test

on:
  pull_request:
    branches: ["main"]
    paths:
      - "services/**"
      - "gen/go/**"
      - ".github/workflows/test.yml"
  workflow_dispatch: ~

permissions:
  contents: read

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The 'go work init' command takes care to set the go.work file's 'go' version directive
      # as needed to be greater than or equal to any module inside that workspace root.
      - name: Initialize Go workspace
        run: make go-work-init

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: '**/go.sum'
      - name: Run tests
        run: make test
