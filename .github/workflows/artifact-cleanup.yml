# Deletes dev artifact versions older than 7 days from GHCR.
# Covers container images, the OCI-hosted Helm chart, and the OCM bundle.
# All are stored as container packages in GHCR and share the same cleanup logic.
# Runs weekly and can be triggered manually.
#
# When adding a new component with a container image, add it to the matrix.images list.
---
name: Cleanup Dev Artifacts

on:
  schedule:
    - cron: "17 3 * * 0" # Weekly, Sunday 03:17 UTC
  workflow_dispatch: ~

permissions:
  contents: read

jobs:
  cleanup-images:
    name: Delete stale dev image versions
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      matrix:
        package:
          - data-ingestion
          - inventory-store
          - telemetry-store
          - inventory-connector
    steps:
      - name: Delete dev versions older than 7 days
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE: ${{ matrix.package }}
          ORG: ${{ github.repository_owner }}
        run: |
          cutoff=$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%SZ)

          gh api \
            "orgs/${ORG}/packages/container/${PACKAGE}/versions" \
            --paginate \
            --jq ".[] | select(.metadata.container.tags | length > 0) | select(.metadata.container.tags[] | startswith(\"dev.\")) | select(.updated_at < \"${cutoff}\") | .id" \
          | while read -r id; do
              echo "Deleting version ${id} of ${PACKAGE}"
              gh api \
                --method DELETE \
                "orgs/${ORG}/packages/container/${PACKAGE}/versions/${id}"
            done

  cleanup-helm:
    name: Delete stale dev Helm chart versions
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Delete dev versions older than 7 days
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ORG: ${{ github.repository_owner }}
          # Helm charts pushed via "helm push oci://" land under a nested package path.
          # GHCR encodes the slash as %2F in the API path.
          PACKAGE: "operational-context-graph%2Foperational-context-graph"
        run: |
          cutoff=$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%SZ)

          gh api \
            "orgs/${ORG}/packages/container/${PACKAGE}/versions" \
            --paginate \
            --jq ".[] | select(.metadata.container.tags | length > 0) | select(.metadata.container.tags[] | startswith(\"dev.\")) | select(.updated_at < \"${cutoff}\") | .id" \
          | while read -r id; do
              echo "Deleting Helm chart version ${id}"
              gh api \
                --method DELETE \
                "orgs/${ORG}/packages/container/${PACKAGE}/versions/${id}"
            done

  # TODO: add cleanup-ocm-bundle job once OCM bundle publishing is implemented.
  # The package path will be operational-context-graph/operational-context-graph-ocm
  # and the cleanup logic is identical to cleanup-helm.
