apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "otelcol.fullname" . }}-config
  labels:
    {{- include "otelcol.labels" . | nindent 4 }}
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          http:
            endpoint: 0.0.0.0:{{ .Values.containerPort }}

    exporters:
      otlp:
        endpoint: {{ .Values.dataIngestionEndpoint }}
        compression: none
        tls:
          insecure: true

    service:
      pipelines:
        logs:
          receivers: [otlp]
          exporters: [otlp]
