# Triggered after CI passes on main. Handles component releases (versioned image, SBOM,
# GitHub Release) and system releases (Helm chart packaging, GitHub Release).
---
name: Release

on:
  # Uses workflow_run instead of push so release jobs only start after CI succeeds.
  # workflow_run runs with base-branch permissions regardless of the triggering workflow's
  # origin. Safe here because all jobs are gated on detect.outputs.release_type, which is
  # only non-empty for release/** merges (impossible to bypass via a fork PR).
  workflow_run:
    workflows: ["Continuous Integration"]
    types: [completed]
    branches: ["main"] # zizmor: ignore[dangerous-triggers]
  # TODO: just for debugging, delete before merge
  workflow_dispatch: ~
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  detect:
    name: Detect Release
    runs-on: ubuntu-latest
    # if: github.event.workflow_run.conclusion == 'success' # TODO UNCOMMENT BEFORE MERGE
    permissions:
      contents: read
      pull-requests: read
    outputs:
      release_type: ${{ steps.parse.outputs.release_type }}
      component: ${{ steps.parse.outputs.component }}
      version: ${{ steps.parse.outputs.version }}
      tag: ${{ steps.parse.outputs.tag }}
      slug: ${{ steps.parse.outputs.slug }}
      has_dockerfile: ${{ steps.parse.outputs.has_dockerfile }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Parse merge source branch
        id: parse
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # Resolve the source branch via the GitHub API.
          # Subject is the PR title, not a merge commit message).
          SOURCE_BRANCH=$(gh api \
            "repos/${REPO}/commits/${HEAD_SHA}/pulls" \
            --jq '.[0].head.ref // ""')
          echo "SOURCE_BRANCH=${SOURCE_BRANCH}"
          scripts/parse-release-branch.sh "${SOURCE_BRANCH}"
      - name: Log detected release
        run: |
          echo "release_type=${{ steps.parse.outputs.release_type }}"
          echo "component=${{ steps.parse.outputs.component }}"
          echo "slug=${{ steps.parse.outputs.slug }}"
          echo "version=${{ steps.parse.outputs.version }}"
          echo "tag=${{ steps.parse.outputs.tag }}"
          echo "has_dockerfile=${{ steps.parse.outputs.has_dockerfile }}"

  # Component release
  #
  # Runs when a release/<slug>/<version> branch is merged.
  # ---
  tag-component:
    name: Tag Component
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.release_type == 'component'
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Push component tag
        run: |
          APP_SLUG="${{ steps.app-token.outputs.app-slug }}"
          APP_USER_ID=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          scripts/configure-git-identity.sh "$APP_SLUG" "$APP_USER_ID"
          git tag -a "${{ needs.detect.outputs.tag }}" \
            -m "chore(release): ${{ needs.detect.outputs.slug }} v${{ needs.detect.outputs.version }}"
          git push origin "${{ needs.detect.outputs.tag }}"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
  publish-container:
    name: Build and Push Container
    runs-on: ubuntu-latest
    needs: [detect, tag-component]
    if: needs.detect.outputs.release_type == 'component' && needs.detect.outputs.has_dockerfile == 'true'
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-packages: write
      # TODO: set up QEMU and docker/buildx for multi-arch if needed (resolve target archs: amd64 only vs amd64+arm64)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0
      - name: Log in to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ steps.app-token.outputs.app-slug }}
          password: ${{ steps.app-token.outputs.token }}
      - name: Build and push container image
        id: push
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: ${{ needs.detect.outputs.component }}/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ needs.detect.outputs.slug }}:${{ needs.detect.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/${{ needs.detect.outputs.slug }}:${{ needs.detect.outputs.version }}-${{ github.sha }}
  attest:
    name: Attest Build Provenance
    runs-on: ubuntu-latest
    needs: [detect, publish-container]
    if: needs.detect.outputs.release_type == 'component' && needs.detect.outputs.has_dockerfile == 'true'
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/${{ needs.detect.outputs.slug }}
          subject-digest: ${{ needs.publish-container.outputs.digest }}
          push-to-registry: true
  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    needs: [detect, publish-container]
    if: needs.detect.outputs.release_type == 'component' && needs.detect.outputs.has_dockerfile == 'true'
    permissions:
      contents: read
      packages: read
    steps:
      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@v0.18.0
        with:
          image: ghcr.io/${{ github.repository_owner }}/${{ needs.detect.outputs.slug }}@${{ needs.publish-container.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: true
          artifact-name: sbom-${{ needs.detect.outputs.slug }}-${{ needs.detect.outputs.version }}.spdx.json
  github-release-component:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [detect, tag-component, attest, sbom]
    if: needs.detect.outputs.release_type == 'component'
    permissions:
      contents: write
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
      - name: Download SBOM artifact
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: sbom-${{ needs.detect.outputs.slug }}-${{ needs.detect.outputs.version }}.spdx.json
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          HAS_DOCKERFILE: ${{ needs.detect.outputs.has_dockerfile }}
        run: |
          # The component release PR already committed the changelog; extract the top section
          # (everything between the first ## heading and the second one).
          CHANGELOG=$(awk '/^## /{if(found) exit; found=1; next} found{print}' \
            "${{ needs.detect.outputs.component }}/CHANGELOG.md")
          if [[ "${HAS_DOCKERFILE}" == "true" ]]; then
            IMAGE_URL="https://ghcr.io/${{ github.repository_owner }}/${{ needs.detect.outputs.slug }}:${{ needs.detect.outputs.version }}"
            NOTES=$(printf '%s\n\n## Container image\n\n%s\n' "${CHANGELOG}" "${IMAGE_URL}")
          else
            NOTES="${CHANGELOG}"
          fi
          gh release create "${{ needs.detect.outputs.tag }}" \
            --title "${{ needs.detect.outputs.slug }} v${{ needs.detect.outputs.version }}" \
            --notes "$NOTES" \
            sbom-${{ needs.detect.outputs.slug }}-${{ needs.detect.outputs.version }}.spdx.json
  # System release
  #
  # Runs when a release/<version> branch is merged.
  # ---
  tag-system:
    name: Tag System Release
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.release_type == 'system'
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Push system tag
        run: |
          APP_SLUG="${{ steps.app-token.outputs.app-slug }}"
          APP_USER_ID=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          scripts/configure-git-identity.sh "$APP_SLUG" "$APP_USER_ID"
          git tag -a "v${{ needs.detect.outputs.version }}" \
            -m "chore(release): system v${{ needs.detect.outputs.version }}"
          git push origin "v${{ needs.detect.outputs.version }}"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
  # Package the umbrella Helm chart with component image tags baked into each subchart's
  # values.yaml. Component images were already published during their respective component
  # releases; this job only reads those versions from CHANGELOG.md and pins them in the chart.
  # Uploads the .tgz as a workflow artifact for github-release-system to attach.
  package-helm-chart:
    name: Package Helm Chart
    runs-on: ubuntu-latest
    needs: [detect, tag-system]
    if: needs.detect.outputs.release_type == 'system'
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Resolve component versions from CHANGELOG.md
        id: versions
        run: |
          # The version matrix written by create-release-pr.yml has this format:
          #   | `services/data-ingestion` | [services/data-ingestion/v1.2.3](...) |
          # Extract the version from the link text in the second column.
          extract_version() {
            local path="$1"
            grep -m1 "^\| \`${path}\`" CHANGELOG.md \
              | grep -oP '\['"${path}"'/v\K[^\]]+' \
              || { echo "::error::Could not resolve version for ${path} from CHANGELOG.md" >&2; exit 1; }
          }

          di=$(extract_version "services/data-ingestion")
          is=$(extract_version "services/inventory-store")
          ts=$(extract_version "services/telemetry-store")
          ci=$(extract_version "services/connectors/inventory")

          echo "data_ingestion_version=${di}"           >> "$GITHUB_OUTPUT"
          echo "inventory_store_version=${is}"          >> "$GITHUB_OUTPUT"
          echo "telemetry_store_version=${ts}"          >> "$GITHUB_OUTPUT"
          echo "inventory_connector_version=${ci}"      >> "$GITHUB_OUTPUT"

          echo "Resolved versions: data-ingestion=${di} inventory-store=${is} telemetry-store=${ts} inventory-connector=${ci}"
      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: Patch subchart image tags
        env:
          DATA_INGESTION_VERSION: ${{ steps.versions.outputs.data_ingestion_version }}
          INVENTORY_STORE_VERSION: ${{ steps.versions.outputs.inventory_store_version }}
          TELEMETRY_STORE_VERSION: ${{ steps.versions.outputs.telemetry_store_version }}
          INVENTORY_CONNECTOR_VERSION: ${{ steps.versions.outputs.inventory_connector_version }}
        run: |
          # Note: yq is available on ubuntu-latest runners.
          yq -i '.image.tag = strenv(DATA_INGESTION_VERSION)'      helm/charts/data-ingestion/values.yaml
          yq -i '.image.tag = strenv(INVENTORY_STORE_VERSION)'     helm/charts/inventory-store/values.yaml
          yq -i '.image.tag = strenv(TELEMETRY_STORE_VERSION)'     helm/charts/telemetry-store/values.yaml
          yq -i '.image.tag = strenv(INVENTORY_CONNECTOR_VERSION)' helm/charts/inventory-connector/values.yaml
      - name: Update Helm dependencies
        run: helm dependency update helm/
      - name: Package Helm chart
        env:
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          helm package helm/ \
            --version "${VERSION}" \
            --app-version "${VERSION}" \
            --destination .
      - name: Upload Helm chart artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: helm-chart-${{ needs.detect.outputs.version }}
          path: operational-context-graph-${{ needs.detect.outputs.version }}.tgz
          retention-days: 1
  # TODO: implement OCM bundling and release.
  # This job is a placeholder that produces a stub descriptor so the GitHub Release
  # attachment wiring is already in place when OCM support is added.
  # ocm:
  #   name: Bundle OCM Component
  #   runs-on: ubuntu-latest
  #   needs: [detect, tag-system]
  #   if: needs.detect.outputs.release_type == 'system'
  #   permissions:
  #     contents: read
  #   steps:
  #     - name: Checkout repository
  #       uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
  #       with:
  #         persist-credentials: false
  #         fetch-depth: 0
  #     - name: Build and push OCM component
  #       env:
  #         VERSION: ${{ needs.detect.outputs.version }}
  #       run: echo "TODO"
  #     - name: Upload OCM bundle artifact
  #       uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
  #       with:
  #         name: ocm-bundle-${{ needs.detect.outputs.version }}
  #         path: ocm-component-${{ needs.detect.outputs.version }}.ctf
  #         retention-days: 1
  github-release-system:
    name: Create System GitHub Release
    runs-on: ubuntu-latest
    needs: [detect, tag-system, package-helm-chart]
    if: needs.detect.outputs.release_type == 'system'
    permissions:
      contents: write
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
      - name: Download Helm chart artifact
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: helm-chart-${{ needs.detect.outputs.version }}
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          NOTES=$(awk '/^## \['"${VERSION}"'\]/{found=1; next} found && /^## /{exit} found{print}' CHANGELOG.md)
          gh release create "v${VERSION}" \
            --title "system v${VERSION}" \
            --notes "${NOTES}" \
            "operational-context-graph-${VERSION}.tgz#Helm chart"
          # TODO: attach OCM bundle once the ocm job above is implemented
