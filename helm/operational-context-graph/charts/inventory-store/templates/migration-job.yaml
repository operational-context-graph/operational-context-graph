{{- $secretName := .Values.migratorSecretName | default .Values.secretName -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "inventory-store.fullname" . }}-migrate
  labels:
    {{- include "inventory-store.labels" . | nindent 4 }}
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "inventory-store.name" . }}-migrate
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsUser: 1000
        runAsNonRoot: true
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z {{ .Release.Name }}-postgres.{{ .Release.Namespace }}.svc.cluster.local 5432; do echo waiting for postgres; sleep 2; done']
      containers:
        - name: migrate
          image: "{{ .Values.migrator.image.repository }}:{{ .Values.migrator.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.migrator.image.pullPolicy }}
          envFrom:
            - secretRef:
                name: {{ $secretName }}
