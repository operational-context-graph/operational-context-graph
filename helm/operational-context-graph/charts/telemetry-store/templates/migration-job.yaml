apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "telemetry-store.fullname" . }}-migrate
  labels:
    {{- include "telemetry-store.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "telemetry-store.name" . }}-migrate
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsUser: 1000
        runAsNonRoot: true
      containers:
        - name: migrate
          image: "{{ .Values.migrator.image.repository }}:{{ .Values.migrator.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.migrator.image.pullPolicy }}
          env:
            - name: DORIS_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.dorisMigratorSecretName }}
                  key: DORIS_MIGRATE_DSN
            - name: REPLICATION_NUM
              value: {{ .Values.env.DORIS_REPLICATION_NUM | quote }}
            - name: BUCKETS
              value: {{ .Values.env.DORIS_BUCKETS | quote }}
