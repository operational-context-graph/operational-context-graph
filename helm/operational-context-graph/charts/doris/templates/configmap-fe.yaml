{{- if .Values.enabled -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-doris-fe-config
  labels:
    app.kubernetes.io/name: doris
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
data:
  fe.conf: |
    meta_dir = {{ .Values.feSpec.config.metaDir }}
    priority_networks = {{ .Values.feSpec.config.priorityNetworks }}
    http_port = {{ .Values.feSpec.config.httpPort }}
    rpc_port = {{ .Values.feSpec.config.rpcPort }}
    query_port = {{ .Values.feSpec.config.queryPort }}
    edit_log_port = {{ .Values.feSpec.config.editLogPort }}
    JAVA_OPTS_FOR_JDK_17 = "{{ .Values.feSpec.config.javaOpts }}"
    query_timeout = {{ .Values.feSpec.config.queryTimeout }}
    stream_load_default_timeout_second = {{ .Values.feSpec.config.streamLoadTimeout }}
{{- end }}
