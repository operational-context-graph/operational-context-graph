# Deletes dev artifact versions older than 7 days from GHCR.
# Covers container images, the OCI-hosted Helm chart, and the OCM bundle.
# All are stored as container packages in GHCR and share the same cleanup logic.
# Runs weekly and can be triggered manually.
#
# When adding a new component with a container image, add it to the matrix.images list.
---
name: Cleanup Dev Artifacts

on:
  schedule:
    - cron: "17 3 * * 0" # Weekly, Sunday 03:17 UTC
  workflow_dispatch: ~

permissions:
  contents: read

jobs:
  cleanup-images:
    name: Delete stale dev image versions
    runs-on: ubuntu-latest
    permissions:
      packages: write  # required: deletes stale dev container image versions from GHCR
    strategy:
      matrix:
        package:
          - data-ingestion
          - inventory-store
          - telemetry-store
          - inventory-connector
    steps:
      - name: Delete dev versions older than 7 days
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE: ${{ matrix.package }}
          ORG: ${{ github.repository_owner }}
        run: |
          cutoff=$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%SZ)

          gh api \
            "orgs/${ORG}/packages/container/${PACKAGE}/versions" \
            --paginate \
            --jq ".[] | select(.metadata.container.tags | length > 0) | select(.metadata.container.tags[] | startswith(\"dev.\")) | select(.updated_at < \"${cutoff}\") | [.id, (.metadata.container.tags | join(\",\")), .updated_at] | @tsv" \
          | while IFS=$'\t' read -r id tags updated_at; do
              echo "Deleting ${PACKAGE}:${tags} (version ${id}, last updated ${updated_at})"
              gh api \
                --method DELETE \
                "orgs/${ORG}/packages/container/${PACKAGE}/versions/${id}"
            done

  cleanup-helm:
    name: Delete stale dev Helm chart versions
    runs-on: ubuntu-latest
    permissions:
      packages: write  # required: deletes stale dev Helm chart versions from GHCR
    steps:
      - name: Delete dev versions older than 7 days
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ORG: ${{ github.repository_owner }}
          # Helm charts pushed via "helm push oci://${REGISTRY}/charts" land at charts/operational-context-graph.
          # GHCR encodes the slash as %2F in the API path.
          PACKAGE: "charts%2Foperational-context-graph"
        run: |
          cutoff=$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%SZ)

          gh api \
            "orgs/${ORG}/packages/container/${PACKAGE}/versions" \
            --paginate \
            --jq ".[] | select(.metadata.container.tags | length > 0) | select(.metadata.container.tags[] | startswith(\"0.0.0-dev.\")) | select(.updated_at < \"${cutoff}\") | [.id, (.metadata.container.tags | join(\",\")), .updated_at] | @tsv" \
          | while IFS=$'\t' read -r id tags updated_at; do
              echo "Deleting helm chart charts/operational-context-graph:${tags} (version ${id}, last updated ${updated_at})"
              gh api \
                --method DELETE \
                "orgs/${ORG}/packages/container/${PACKAGE}/versions/${id}"
            done

  cleanup-ocm-bundle:
    name: Delete stale dev OCM bundle versions
    runs-on: ubuntu-latest
    permissions:
      packages: write  # required: deletes stale dev OCM bundle versions from GHCR
    steps:
      - name: Delete dev versions older than 7 days
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ORG: ${{ github.repository_owner }}
          # OCM bundles pushed to oci::${REGISTRY}/ocm land at
          # ocm/component-descriptors/github.com/operational-context-graph/operational-context-graph.
          # GHCR encodes slashes as %2F in the API path.
          PACKAGE: "ocm%2Fcomponent-descriptors%2Fgithub.com%2Foperational-context-graph%2Foperational-context-graph"
        run: |
          cutoff=$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%SZ)

          gh api \
            "orgs/${ORG}/packages/container/${PACKAGE}/versions" \
            --paginate \
            --jq ".[] | select(.metadata.container.tags | length > 0) | select(.metadata.container.tags[] | startswith(\"0.0.0-dev.\")) | select(.updated_at < \"${cutoff}\") | [.id, (.metadata.container.tags | join(\",\")), .updated_at] | @tsv" \
          | while IFS=$'\t' read -r id tags updated_at; do
              echo "Deleting OCM bundle ${tags} (version ${id}, last updated ${updated_at})"
              gh api \
                --method DELETE \
                "orgs/${ORG}/packages/container/${PACKAGE}/versions/${id}"
            done
