# Fires on a component release tag push (services/**/vX.Y.Z). The tag is pushed by
# merge-gate.yml after a component release PR squash-merges to main. This workflow
# aliases the dev container image to the release version tag. No image build, no
# GitHub Release for components.
#
# The tag's commit (github.sha) is the squash commit on main that ci.yml publish-dev
# built the dev image from, so the dev image tag is reconstructed from github.sha
# directly — no workflow_run.head_sha or commits/<sha>/pulls lookup.
---
name: Release Component

on:
  push:
    tags:
      - "services/**/v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Component tag to rehearse (e.g. services/data-ingestion/v1.2.3)"
        required: true
        type: string
      dry_run:
        description: "Resolve and log actions without pushing image tags"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  detect:
    name: Detect Release
    runs-on: ubuntu-latest
    outputs:
      release_type: ${{ steps.parse.outputs.release_type }}
      component: ${{ steps.parse.outputs.component }}
      slug: ${{ steps.parse.outputs.slug }}
      version: ${{ steps.parse.outputs.version }}
      tag: ${{ steps.parse.outputs.tag }}
      has_dockerfile: ${{ steps.parse.outputs.has_dockerfile }}
      head_sha: ${{ steps.sha.outputs.head_sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Parse release tag
        id: parse
        env:
          TAG_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: scripts/parse-release-tag.sh "${TAG_REF}"
      - name: Resolve release commit
        id: sha
        # On a real tag push, github.sha is the tagged commit. On workflow_dispatch,
        # github.sha is HEAD of the ref the workflow runs from, NOT the dispatched
        # tag's commit, so resolve the commit from the tag ref explicitly.
        env:
          EVENT_NAME: ${{ github.event_name }}
          TAG: ${{ steps.parse.outputs.tag }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          if [ "${EVENT_NAME}" = "workflow_dispatch" ] && [ -n "${TAG}" ]; then
            head_sha=$(git rev-list -n1 "refs/tags/${TAG}")
          else
            head_sha="${PUSH_SHA}"
          fi
          echo "head_sha=${head_sha}" >> "$GITHUB_OUTPUT"
          echo "Release commit: ${head_sha}"
      - name: Log detected release
        env:
          RELEASE_TYPE: ${{ steps.parse.outputs.release_type }}
          SLUG: ${{ steps.parse.outputs.slug }}
          VERSION: ${{ steps.parse.outputs.version }}
          TAG: ${{ steps.parse.outputs.tag }}
        run: |
          if [ "${RELEASE_TYPE}" != "component" ]; then
            echo "Not a component release tag (type='${RELEASE_TYPE}'). Jobs will be skipped."
          else
            echo "release_type=${RELEASE_TYPE} slug=${SLUG} version=${VERSION} tag=${TAG}"
          fi

  retag-component-image:
    name: Retag Component Image to Release Version
    runs-on: ubuntu-latest
    needs: detect
    if: |
      needs.detect.outputs.release_type == 'component' &&
      needs.detect.outputs.has_dockerfile == 'true'
    permissions:
      contents: read
      packages: write  # required: crane tag retags the dev container image in GHCR to the release version
    steps:
      - name: Install crane
        env:
          CRANE_VERSION: "v0.22.1"
          CRANE_SHA256: "0ab7a1d6932a213aed964ce97666c3077fe691c8606413674a8b3e0b9ec4cda0"
        run: |
          archive="go-containerregistry_Linux_x86_64.tar.gz"
          url="https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/${archive}"
          curl -fsSL -o "${archive}" "${url}"
          echo "${CRANE_SHA256}  ${archive}" | sha256sum -c -
          mkdir -p ~/.local/bin
          tar -xzf "${archive}" -C ~/.local/bin crane
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Retag dev image to release version
        env:
          REGISTRY: ghcr.io/${{ github.repository_owner }}
          SLUG: ${{ needs.detect.outputs.slug }}
          VERSION: ${{ needs.detect.outputs.version }}
          HEAD_SHA: ${{ needs.detect.outputs.head_sha }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          COMMIT_DATE=$(gh api "repos/${REPO}/commits/${HEAD_SHA}" \
            --jq '.commit.committer.date' \
            | cut -c1-10 \
            | tr -d '-')
          DEV_TAG="dev.${COMMIT_DATE}-${HEAD_SHA:0:7}"
          src="${REGISTRY}/${SLUG}:${DEV_TAG}"
          if [ "${DRY_RUN}" = "true" ]; then
            echo "DRY RUN: would retag ${src} → ${VERSION}, ${VERSION}-${HEAD_SHA:0:7}"
            exit 0
          fi
          ~/.local/bin/crane tag "${src}" "${VERSION}"
          ~/.local/bin/crane tag "${src}" "${VERSION}-${HEAD_SHA:0:7}"
          echo "Retagged ${src} → ${VERSION}, ${VERSION}-${HEAD_SHA:0:7}"
