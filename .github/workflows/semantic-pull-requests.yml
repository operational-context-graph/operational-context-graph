---
name: "Semantic Pull Requests"

on:
  pull_request:
    types:
      - opened
      - edited

permissions:
  pull-requests: write

jobs:
  validate-pr-title:
    name: Validate PR title
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        id: lint_pr_title
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        with:
          scopes: |
            deps
            devops
            security
            deployment
            architecture
            ci
            github
            ocg
          requireScope: false
          subjectPattern: ${{ github.actor == 'renovate[bot]' && '.+' || '^.+ \((#[0-9]+|NO-TICKET)\)$' }}
          subjectPatternError: |
            The subject "{subject}" found in the pull request title "{title}" didn't match the configured pattern.
            Please ensure that the subject ends with "(#123)" where "#123" is the GitHub issue number; or (NO-TICKET) if there isn't a related issue.

      - uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        # When the previous steps fails, the workflow would stop. By adding this
        # condition you can continue the execution with the populated error message.
        if: always() && (steps.lint_pr_title.outputs.error_message != null)
        with:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          header: pr-title-lint-error
          message: |
            We require pull request titles to follow the [Conventional Commits specification](https://www.conventionalcommits.org/en/v1.0.0/) and we detected that your proposed title needs to be adjusted.

            ~~~
            ${{ steps.lint_pr_title.outputs.error_message }}
            ~~~

      # Delete a previous comment when the issue has been resolved
      - if: ${{ steps.lint_pr_title.outputs.error_message == null }}
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          header: pr-title-lint-error
          delete: true
