{{- $feAddress := .Values.feAddress | default (printf "%s-%s" .Release.Name "doris-fe") -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "doris-be.fullname" . }}
  labels:
    {{- include "doris-be.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "doris-be.fullname" . }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "doris-be.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "doris-be.selectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      initContainers:
        - name: resolve-fe-ip
          image: busybox:1.36@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
          command:
            - sh
            - -c
            - |
              until FE_IP=$(nslookup {{ $feAddress }}.{{ .Release.Namespace }}.svc.cluster.local 2>/dev/null | awk '/^Address: /{print $2}' | grep -v '#' | head -1) && [ -n "$FE_IP" ]; do
                echo "waiting for FE DNS..."; sleep 3
              done
              echo "Resolved FE IP: $FE_IP"
              echo "$FE_IP" > /shared/fe_ip
          volumeMounts:
            - name: shared
              mountPath: /shared
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          command:
            - bash
            - -c
            - |
              FE_IP=$(cat /shared/fe_ip)
              export FE_SERVERS="{{ .Values.feNodeName }}:${FE_IP}:{{ .Values.feEditLogPort }}"
              export BE_ADDR="$(hostname -i):{{ .Values.ports.heartbeat }}"
              exec bash entry_point.sh
          ports:
            - name: rpc
              containerPort: {{ .Values.ports.rpc }}
              protocol: TCP
            - name: http
              containerPort: {{ .Values.ports.http }}
              protocol: TCP
            - name: heartbeat
              containerPort: {{ .Values.ports.heartbeat }}
              protocol: TCP
            - name: brpc
              containerPort: {{ .Values.ports.brpc }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /opt/apache-doris/be/storage
            - name: shared
              mountPath: /shared
      volumes:
        - name: shared
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.storage.storageClassName }}
        storageClassName: {{ .Values.storage.storageClassName | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.storage.size }}
