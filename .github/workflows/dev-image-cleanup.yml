# Deletes dev image versions older than 7 days from GHCR.
# Targets all container packages in the org that have versions tagged with "dev.".
# Runs weekly and can be triggered manually.
#
# When adding a new component with a container image, add it to the matrix below.
---
name: Cleanup Dev Images

on:
  schedule:
    - cron: "17 3 * * 0" # Weekly, Sunday 03:17 UTC
  workflow_dispatch: ~

permissions:
  contents: read

jobs:
  cleanup:
    name: Delete stale dev image versions
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      matrix:
        package:
          - data-ingestion
          - inventory-store
          - telemetry-store
          - inventory-connector
    steps:
      - name: Delete dev versions older than 7 days
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE: ${{ matrix.package }}
          ORG: ${{ github.repository_owner }}
        run: |
          cutoff=$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%SZ)

          gh api \
            "orgs/${ORG}/packages/container/${PACKAGE}/versions" \
            --paginate \
            --jq ".[] | select(.metadata.container.tags | length > 0) | select(.metadata.container.tags[] | startswith(\"dev.\")) | select(.updated_at < \"${cutoff}\") | .id" \
          | while read -r id; do
              echo "Deleting version ${id} of ${PACKAGE}"
              gh api \
                --method DELETE \
                "orgs/${ORG}/packages/container/${PACKAGE}/versions/${id}"
            done
