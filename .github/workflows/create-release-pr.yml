---
name: Create Release PR

on:
  workflow_dispatch:
    inputs:
      version:
        description: "System version (X.Y.Z, without v prefix)"
        required: true
        type: string
      release_type:
        description: "Release type"
        required: true
        default: system
        type: choice
        options:
          - system

permissions:
  contents: read

jobs:
  create-release-pr:
    name: Create System Release PR
    runs-on: ubuntu-latest
    if: github.event.inputs.release_type == 'system'
    permissions:
      contents: write
      pull-requests: write
    env:
      VERSION: ${{ github.event.inputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.RELEASE_PAT }}

      - name: Validate version format
        run: |
          echo "${VERSION}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$' || {
            echo "ERROR: VERSION '${VERSION}' is not valid semver (X.Y.Z)"
            exit 1
          }

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create release branch
        run: |
          git checkout -b "release/v${VERSION}"

      - name: Bump helm/ocg/Chart.yaml version and appVersion
        run: |
          # Update both version and appVersion fields in Chart.yaml
          sed -i "s/^version:.*/version: \"${VERSION}\"/" helm/ocg/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"${VERSION}\"/" helm/ocg/Chart.yaml
          echo "Updated helm/ocg/Chart.yaml to version ${VERSION}"
          grep -E '^(version|appVersion):' helm/ocg/Chart.yaml

      - name: Generate component version matrix (RELEASE.md)
        run: |
          SERVICES="data-ingestion inventory-store telemetry-store inventory-connector schema-registry"
          {
            echo "# Release v${VERSION} — Component Version Matrix"
            echo ""
            echo "| Component | Tag |"
            echo "| --- | --- |"
            for svc in ${SERVICES}; do
              tag=$(git tag -l "services/${svc}/v*" | \
                    grep -E "^services/${svc}/v[0-9]+\.[0-9]+\.[0-9]+$" | \
                    sort -V | tail -1 || echo "services/${svc}/v0.0.0-MISSING")
              echo "| ${svc} | \`${tag}\` |"
            done
            echo ""
            echo "_Generated by create-release-pr.yml on $(date -u +%Y-%m-%dT%H:%M:%SZ)_"
          } > RELEASE.md
          echo "Generated RELEASE.md:"
          cat RELEASE.md

      - name: Install git-cliff
        run: |
          CLIFF_VERSION=v2.7.0
          curl -fsSL \
            "https://github.com/orhun/git-cliff/releases/download/${CLIFF_VERSION}/git-cliff-${CLIFF_VERSION#v}-x86_64-unknown-linux-musl.tar.gz" \
            -o /tmp/git-cliff.tgz
          tar -xzf /tmp/git-cliff.tgz -C /tmp/
          install -m 0755 /tmp/git-cliff-*/git-cliff /usr/local/bin/git-cliff

      - name: Generate root CHANGELOG.md
        run: |
          # Scoped to commits since the last bare v<semver> tag
          # Cross-cutting commits only (not commits already in per-component tags)
          LAST_TAG=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -1 || echo "")
          if [ -n "${LAST_TAG}" ]; then
            git-cliff "${LAST_TAG}..HEAD" \
              --tag "v${VERSION}" \
              --output CHANGELOG.md
          else
            git-cliff \
              --tag "v${VERSION}" \
              --output CHANGELOG.md
          fi
          echo "Generated CHANGELOG.md (first 20 lines):"
          head -20 CHANGELOG.md

      - name: Commit release artifacts
        run: |
          git add helm/ocg/Chart.yaml RELEASE.md CHANGELOG.md
          git diff --cached --stat
          git commit -m "chore(release): bump system version to v${VERSION}

          - Update helm/ocg/Chart.yaml to version ${VERSION}
          - Generate RELEASE.md component matrix
          - Generate root CHANGELOG.md via git-cliff"

      - name: Push release branch
        run: |
          git push origin "release/v${VERSION}"

      - name: Create pull request
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          gh pr create \
            --title "chore(release): system release v${VERSION}" \
            --body "$(cat RELEASE.md)" \
            --base main \
            --head "release/v${VERSION}" \
            --label "release"
