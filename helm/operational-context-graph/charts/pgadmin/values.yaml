# Default values for the pgadmin subchart.
# Disabled by default — enable in local/demo overlays only.
enabled: false

image:
  repository: dpage/pgadmin4
  tag: "8"
  pullPolicy: IfNotPresent

# Name of a pre-existing Secret with keys:
#   PGADMIN_DEFAULT_EMAIL, PGADMIN_DEFAULT_PASSWORD
secretName: pgadmin-secret

service:
  port: 80

nameOverride: ""
fullnameOverride: ""
