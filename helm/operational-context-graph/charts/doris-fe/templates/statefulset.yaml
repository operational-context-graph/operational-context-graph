apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "doris-fe.fullname" . }}
  labels:
    {{- include "doris-fe.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "doris-fe.fullname" . }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "doris-fe.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "doris-fe.selectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.ports.http }}
              protocol: TCP
            - name: rpc
              containerPort: {{ .Values.ports.rpc }}
              protocol: TCP
            - name: query
              containerPort: {{ .Values.ports.query }}
              protocol: TCP
            - name: heartbeat
              containerPort: {{ .Values.ports.heartbeat }}
              protocol: TCP
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: FE_SERVERS
              value: "{{ .Values.feNodeName }}:$(POD_IP):{{ .Values.ports.heartbeat }}"
            - name: FE_ID
              value: {{ .Values.feId | quote }}
          livenessProbe:
            httpGet:
              path: /api/bootstrap
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/bootstrap
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /opt/apache-doris/fe/doris-meta
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.storage.storageClassName }}
        storageClassName: {{ .Values.storage.storageClassName | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.storage.size }}
