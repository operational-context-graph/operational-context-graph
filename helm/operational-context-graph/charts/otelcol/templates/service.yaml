apiVersion: v1
kind: Service
metadata:
  name: {{ include "otelcol.fullname" . }}
  labels:
    {{- include "otelcol.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: otlp-http
      protocol: TCP
      name: otlp-http
  selector:
    {{- include "otelcol.selectorLabels" . | nindent 4 }}
