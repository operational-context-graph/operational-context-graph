# Default values for the doris subchart.
# The Doris Operator watches the DorisCluster CR rendered from these values.
# Override feSpec/beSpec in the parent chart's values.yaml.
enabled: true

feSpec:
  replicas: 1
  image: apache/doris:fe-4.1.4
  requests:
    cpu: "2"
    memory: 4Gi
  limits:
    cpu: "4"
    memory: 8Gi
  persistentVolumes:
    - mountPath: /opt/apache-doris/fe/doris-meta
      name: fe-meta
      persistentVolumeClaimSpec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
    - mountPath: /opt/apache-doris/fe/log
      name: fe-log
      persistentVolumeClaimSpec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
  config:
    metaDir: /opt/apache-doris/fe/doris-meta
    priorityNetworks: 10.0.0.0/8
    httpPort: 8030
    rpcPort: 9020
    queryPort: 9030
    editLogPort: 9010
    javaOpts: "-Xmx4096m -Xms4096m"
    queryTimeout: 300
    streamLoadTimeout: 600

beSpec:
  replicas: 1
  image: apache/doris:be-4.1.4
  requests:
    cpu: "4"
    memory: 8Gi
  limits:
    cpu: "8"
    memory: 16Gi
  persistentVolumes:
    - mountPath: /opt/apache-doris/be/storage
      name: be-storage
      persistentVolumeClaimSpec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 20Gi
    - mountPath: /opt/apache-doris/be/log
      name: be-log
      persistentVolumeClaimSpec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
  config:
    storageRootPath: /opt/apache-doris/be/storage
    priorityNetworks: 10.0.0.0/8
    bePort: 9060
    webserverPort: 8040
    heartbeatServicePort: 9050
    brpcPort: 8060
    cumulativeCompactionThreads: 2
    baseCompactionThreads: 1
    maxCompactionThreads: 10
    memLimit: "90%"
    streamingLoadMaxMb: 10240
