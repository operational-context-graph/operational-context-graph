# Mints the release git tag after a release PR squash-merges to main.
#
# Triggers on push to main (fork-safe: a fork cannot push to the protected
# default branch, so the release App private key is never in scope for an
# untrusted event). The squash commit subject carries the PR number as "(#N)".
# This job recovers the source branch via one targeted PR lookup by that number,
# parses it with parse-release-branch.sh, and pushes the version tag as the App.
# The tag push is what triggers release-component.yml / release-system.yml.
#
# Note: the squash commit has no release/** branch as a parent and
# the subject does not name the branch, so branch recovery MUST go through the
# PR number, not commit parentage.
---
name: Merge Gate

on:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  detect:
    name: Detect Release Merge
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      release_type: ${{ steps.parse.outputs.release_type }}
      slug: ${{ steps.parse.outputs.slug }}
      version: ${{ steps.parse.outputs.version }}
      tag: ${{ steps.parse.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Resolve merged PR number
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          # Squash subjects end with "(#N)". Read the first line only so a "(#N)"
          # appearing in the body cannot be mistaken for the PR number.
          subject="${HEAD_COMMIT_MESSAGE%%$'\n'*}"
          pr=$(printf '%s' "${subject}" | grep -oE '\(#[0-9]+\)$' | tr -dc '0-9' || true)
          if [ -z "${pr}" ]; then
            echo "No PR number in commit subject; not a squash-merged PR. Skipping."
            echo "pr_number=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! printf '%s' "${pr}" | grep -qE '^[0-9]+$'; then
            echo "::error::Resolved PR number '${pr}' is not numeric"
            exit 1
          fi
          echo "pr_number=${pr}" >> "$GITHUB_OUTPUT"
          echo "Resolved PR #${pr}"
      - name: Parse release branch from PR head ref
        id: parse
        if: steps.pr.outputs.pr_number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
        run: |
          set -euo pipefail
          # Targeted lookup by explicit PR number (not a commit->pulls guess).
          HEAD_REF=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}" --jq '.head.ref // ""')
          echo "PR #${PR_NUMBER} head ref: ${HEAD_REF:-<none>}"
          scripts/parse-release-branch.sh "${HEAD_REF}"
      - name: Log detection
        env:
          RELEASE_TYPE: ${{ steps.parse.outputs.release_type }}
          TAG: ${{ steps.parse.outputs.tag }}
        run: |
          if [ -z "${RELEASE_TYPE:-}" ]; then
            echo "Merge is not a release branch. No tag will be pushed."
          else
            echo "Release merge detected: type=${RELEASE_TYPE} tag=${TAG}"
          fi

  push-release-tag:
    name: Push Release Tag
    needs: detect
    if: needs.detect.outputs.release_type != ''
    uses: $/.github/workflows/shared/push-release-tag.yml
    with:
      tag: ${{ needs.detect.outputs.tag }}
      message: >-
        chore(release):
        ${{ needs.detect.outputs.release_type == 'component'
          && format('{0} v{1}', needs.detect.outputs.slug, needs.detect.outputs.version)
          || format('system v{0}', needs.detect.outputs.version) }}
      client_id: ${{ vars.APP_CLIENT_ID }}
    secrets:
      private_key: ${{ secrets.APP_PRIVATE_KEY }}
