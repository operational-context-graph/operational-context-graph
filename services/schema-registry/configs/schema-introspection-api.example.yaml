# Supply database.url through secret-backed environment variables.
# Choose database SSL through URL parameters; the service adds no TLS policy.
# Omitted SSL parameters retain database-driver defaults.
server:
  host: 0.0.0.0
  port: 8081
database:
  pool_max_connections: 8
  reserved_connections: 1
admission:
  max_in_flight: 7
logging:
  level: info
