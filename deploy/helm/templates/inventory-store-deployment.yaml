apiVersion: apps/v1
kind: Deployment
metadata:
  name: ocg-inventory-store
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: ocg-inventory-store
    app.kubernetes.io/managed-by: Helm
    ccloud/service: {{ .Values.labels.service }}
    ccloud/support-group: {{ .Values.labels.supportGroup }}
spec:
  replicas: {{ .Values.inventoryStore.replicas }}
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: ocg-inventory-store
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ocg-inventory-store
    spec:
      securityContext:
        runAsUser: 1000
        runAsNonRoot: true
      containers:
        - name: inventory-store
          image: "{{ .Values.registry }}/{{ .Values.inventoryStore.image }}:{{ .Values.inventoryStore.tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: {{ .Values.inventoryStore.port }}
          env:
            - name: HTTP_PORT
              value: "{{ .Values.inventoryStore.port }}"
            - name: LOG_LEVEL
              value: "{{ .Values.logLevel }}"
            - name: DB_MAX_OPEN_CONNS
              value: "25"
            - name: DB_MAX_IDLE_CONNS
              value: "5"
            - name: DB_CONN_MAX_LIFETIME
              value: "5m"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ocg-postgres-credentials
                  key: url
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.inventoryStore.port }}
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: {{ .Values.inventoryStore.port }}
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: ocg-inventory-store
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: ocg-inventory-store
    app.kubernetes.io/managed-by: Helm
    ccloud/service: {{ .Values.labels.service }}
    ccloud/support-group: {{ .Values.labels.supportGroup }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ocg-inventory-store
  ports:
    - name: http
      port: {{ .Values.inventoryStore.port }}
      targetPort: {{ .Values.inventoryStore.port }}
