# Development-only PostgreSQL. Enable from the umbrella chart with
# `postgres.enabled: true` (see values.local.yaml). In production this subchart
# stays disabled and the service points at the existing OCG PostgreSQL instance.
enabled: false

# Stable resource name so other subcharts can reference the service by host.
fullnameOverride: ocg-postgres

image:
  repository: postgres
  tag: "16-alpine"
  pullPolicy: IfNotPresent

auth:
  database: ocg
  username: ocg
  # Dev password. Overridden in values.local.yaml. Never set a real secret here.
  password: ""
  # When set, the StatefulSet reads the password from this existing Secret
  # instead of the one this chart creates.
  existingSecret: ""
  secretKey: password

service:
  port: 5432

persistence:
  enabled: true
  size: 1Gi
  storageClassName: ""

resources: {}
