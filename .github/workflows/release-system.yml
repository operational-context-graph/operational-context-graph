# Fires after CI passes on main. For system releases: pushes a git tag, builds retags the
# dev Helm chart to the release version and signs the OCM bundle, and creates a GitHub Release
# with the Helm chart and OCM CTF archive attached.
#
# Both release-component.yml and release-system.yml fire on every CI completion on main.
# This workflow exits cleanly when the merge was not a system release branch.
---
name: Release System

on:
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: ["Continuous Integration"]
    types: [completed]
    branches: ["main"]

permissions:
  contents: read
  packages: read

jobs:
  detect:
    name: Detect Release
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      pull-requests: read
    outputs:
      release_type: ${{ steps.parse.outputs.release_type }}
      version: ${{ steps.parse.outputs.version }}
      tag: ${{ steps.parse.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Parse merge source branch
        id: parse
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          SOURCE_BRANCH=$(gh api \
            "repos/${REPO}/commits/${HEAD_SHA}/pulls" \
            --jq '.[0].head.ref // ""')
          echo "SOURCE_BRANCH=${SOURCE_BRANCH}"
          scripts/parse-release-branch.sh "${SOURCE_BRANCH}"
      - name: Log detected release
        env:
          RELEASE_TYPE: ${{ steps.parse.outputs.release_type }}
          VERSION: ${{ steps.parse.outputs.version }}
          TAG: ${{ steps.parse.outputs.tag }}
        run: |
          if [ -z "${RELEASE_TYPE}" ]; then
            echo "Not a release merge. All jobs will be skipped (branch: ${SOURCE_BRANCH})"
          else
            echo "release_type=${RELEASE_TYPE} version=${VERSION} tag=${TAG}"
          fi

  tag-system:
    name: Tag System Release
    needs: detect
    if: needs.detect.outputs.release_type == 'system'
    uses: $/.github/workflows/shared/push-release-tag.yml
    with:
      tag: "v${{ needs.detect.outputs.version }}"
      message: "chore(release): system v${{ needs.detect.outputs.version }}"
      client_id: ${{ vars.APP_CLIENT_ID }}
    secrets:
      private_key: ${{ secrets.APP_PRIVATE_KEY }}

  alias-release-artifacts:
    name: Alias Release Artifacts to Release Version
    runs-on: ubuntu-latest
    needs: [detect, tag-system]
    if: needs.detect.outputs.release_type == 'system'
    permissions:
      contents: read
      packages: write  # required: crane tag retags the dev Helm chart in GHCR to the release version
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install crane
        env:
          CRANE_VERSION: "v0.22.1"
          CRANE_SHA256: "0ab7a1d6932a213aed964ce97666c3077fe691c8606413674a8b3e0b9ec4cda0"
        run: |
          archive="go-containerregistry_Linux_x86_64.tar.gz"
          url="https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/${archive}"
          curl -fsSL -o "${archive}" "${url}"
          echo "${CRANE_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "${archive}" crane
          sudo mv crane /usr/local/bin/crane
          crane version
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Alias dev Helm chart to release version
        env:
          REGISTRY: ghcr.io/${{ github.repository_owner }}
          VERSION: ${{ needs.detect.outputs.version }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          COMMIT_DATE=$(gh api "repos/${REPO}/commits/${HEAD_SHA}" \
            --jq '.commit.committer.date' \
            | cut -c1-10 \
            | tr -d '-')
          DEV_TAG="0.0.0-dev.${COMMIT_DATE}-${HEAD_SHA:0:7}"
          src="${REGISTRY}/operational-context-graph-helm/operational-context-graph:${DEV_TAG}"
          crane tag "${src}" "${VERSION}"
          echo "Aliased Helm chart ${src} → ${VERSION}"

  # ─────────────────────────────────────────────────────────────────────────────
  # OCM Bundle: re-version the dev CTF from GHCR to the release version.
  # Downloads the CI-built dev bundle (same image content as tested), extracts
  # resources, rebuilds CTF at release version, signs, and pushes to GHCR.
  # This avoids re-pulling service images from the registry.
  # ─────────────────────────────────────────────────────────────────────────────
  ocm-bundle:
    name: OCM Bundle
    runs-on: ubuntu-latest
    needs: [detect, tag-system]
    if: needs.detect.outputs.release_type == 'system'
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.detect.outputs.version }}
      OCM_VERSION: "0.22.1"
      OCM_CLI_SHA256: "15532daec120686519dc3d122e078820114f2bd090b1ed3091e9bea6704339ca"
      REGISTRY: ghcr.io/${{ github.repository_owner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: "v${{ needs.detect.outputs.version }}"
          fetch-depth: 0
          persist-credentials: false

      - name: Install OCM v2 CLI
        run: |
          curl -fsSL \
            "https://github.com/open-component-model/open-component-model/releases/download/v${OCM_VERSION}/ocm-linux-amd64" \
            -o /tmp/ocm-bin
          echo "${OCM_CLI_SHA256}  /tmp/ocm-bin" | sha256sum --check --status || {
            echo "ERROR: OCM CLI checksum mismatch"
            sha256sum /tmp/ocm-bin
            exit 1
          }
          install -m 0755 /tmp/ocm-bin /usr/local/bin/ocm
          ocm version

      - name: Install tools (helm, yq)
        run: |
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          curl -fsSL "https://github.com/mikefarah/yq/releases/download/v4.44.6/yq_linux_amd64" \
            -o /usr/local/bin/yq
          chmod +x /usr/local/bin/yq

      - name: Write signing key
        env:
          OCM_SIGNING_KEY: ${{ secrets.OCM_SIGNING_KEY }}
        run: |
          printf '%s' "${OCM_SIGNING_KEY}" > /tmp/ocg-signing-key.pem
          chmod 600 /tmp/ocg-signing-key.pem

      - name: Resolve dev bundle version
        id: dev-version
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          COMMIT_DATE=$(gh api "repos/${REPO}/commits/${HEAD_SHA}" \
            --jq '.commit.committer.date' \
            | cut -c1-10 \
            | tr -d '-')
          DEV_VERSION="0.0.0-dev.${COMMIT_DATE}-${HEAD_SHA:0:7}"
          echo "dev_version=${DEV_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved dev bundle version: ${DEV_VERSION}"

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Release preflight
        run: VERSION="${VERSION}" make ocm-release-preflight

      - name: Re-version, sign, and verify OCM bundle
        env:
          DEV_VERSION: ${{ steps.dev-version.outputs.dev_version }}
        run: |
          SIGN_KEY=/tmp/ocg-signing-key.pem \
            scripts/ocm-reversion.sh "${DEV_VERSION}" "${VERSION}" "${REGISTRY}"

      - name: Push CTF to GHCR as OCI
        run: |
          ocm transfer component-version \
            ctf::./bin/ctf// \
            "oci::${REGISTRY}/operational-context-graph"

      - name: Upload OCM CTF artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ocg-ctf-${{ needs.detect.outputs.version }}
          path: bin/ocg-${{ needs.detect.outputs.version }}.ctf.tgz
          retention-days: 30

  pull-helm-chart:
    name: Pull Helm Chart from OCI
    runs-on: ubuntu-latest
    needs: [detect, alias-release-artifacts]
    if: needs.detect.outputs.release_type == 'system'
    permissions:
      contents: read
      packages: read
    steps:
      - name: Set up Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull Helm chart from OCI registry
        env:
          VERSION: ${{ needs.detect.outputs.version }}
          REGISTRY: ghcr.io/${{ github.repository_owner }}
        run: |
          helm pull \
            "oci://${REGISTRY}/operational-context-graph-helm/operational-context-graph" \
            --version "${VERSION}"
          ls -la "operational-context-graph-${VERSION}.tgz"
      - name: Upload Helm chart artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ocg-helm-${{ needs.detect.outputs.version }}
          path: operational-context-graph-${{ needs.detect.outputs.version }}.tgz
          retention-days: 1

  generate-system-release-notes:
    name: Generate System Release Notes
    runs-on: ubuntu-latest
    needs: [detect, tag-system]
    if: needs.detect.outputs.release_type == 'system'
    permissions:
      contents: read
    outputs:
      notes: ${{ steps.notes.outputs.notes }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: "v${{ needs.detect.outputs.version }}"
          persist-credentials: false
          fetch-depth: 0
      - name: Build release notes
        id: notes
        env:
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          NOTES=$(scripts/extract-release-notes.sh "${VERSION}" CHANGELOG.md)
          printf 'notes<<EOF\n%s\nEOF\n' "${NOTES}" >> "$GITHUB_OUTPUT"

  github-release-system:
    name: Create System GitHub Release
    needs: [detect, pull-helm-chart, ocm-bundle, generate-system-release-notes]
    if: needs.detect.outputs.release_type == 'system'
    uses: $/.github/workflows/shared/create-github-release.yml
    with:
      tag: "v${{ needs.detect.outputs.version }}"
      title: "system v${{ needs.detect.outputs.version }}"
      notes: ${{ needs.generate-system-release-notes.outputs.notes }}
      artifacts: |
        ocg-helm-${{ needs.detect.outputs.version }}:operational-context-graph-${{ needs.detect.outputs.version }}.tgz#Helm chart
        ocg-ctf-${{ needs.detect.outputs.version }}:ocg-${{ needs.detect.outputs.version }}.ctf.tgz#OCM bundle
      client_id: ${{ vars.APP_CLIENT_ID }}
    secrets:
      private_key: ${{ secrets.APP_PRIVATE_KEY }}
