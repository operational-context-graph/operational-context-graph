# Local/dev overrides.
# Create the secret before deploying:
#   kubectl create secret generic postgres-secret --from-literal=password=<your-password>

postgresql:
  primary:
    persistence:
      size: 1Gi

inventory-store:
  image:
    repository: localhost:5001/inventory-store
    tag: local
    pullPolicy: Always
  database:
    host: ocg-postgresql
    sslmode: disable
    passwordSecret:
      name: postgres-secret
      key: password

data-ingestion:
  image:
    repository: localhost:5001/data-ingestion
    tag: local
    pullPolicy: Always
  database:
    host: ocg-postgresql
    sslmode: disable
    passwordSecret:
      name: postgres-secret
      key: password
  inventoryStore:
    baseURL: "http://ocg-inventory-store:8080"

inventory-connector:
  enabled: true
  image:
    repository: inventory-connector
    tag: dev
    pullPolicy: Never
  netbox:
    baseURL: "http://host.docker.internal:8081"
    pageSize: 1000
    tokenSecret:
      name: netbox-token
      key: token
  grpc:
    endpoint: "ocg-data-ingestion:9090"
    connectorID: "ocg-inventory-connector"
  connector:
    schemaVersion: "0.1.0"
    endpoints:
      - "dcim/sites/"
      - "dcim/device-types/"
