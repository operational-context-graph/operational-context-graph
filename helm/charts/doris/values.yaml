enabled: true

feSpec:
  replicas: 1
  electionNumber: 1
  image: apache/doris:fe-4.1.4@sha256:3cbfc9b6293057a0b7f10c2e597f20f4a6bafed0729dfa9795db21eae2e136bb
  requests:
    cpu: "2"
    memory: 4Gi
  limits:
    cpu: "4"
    memory: 8Gi
  persistentVolumes:
    - mountPath: /opt/apache-doris/fe/doris-meta
      name: fe-meta
      persistentVolumeClaimSpec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
    - mountPath: /opt/apache-doris/fe/log
      name: fe-log
      persistentVolumeClaimSpec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
  config: |
    meta_dir = /opt/apache-doris/fe/doris-meta
    priority_networks = 10.0.0.0/8
    http_port = 8030
    rpc_port = 9020
    query_port = 9030
    edit_log_port = 9010
    JAVA_OPTS_FOR_JDK_17 = "-Xmx4096m -Xms4096m"
    query_timeout = 300
    stream_load_default_timeout_second = 600
    enable_fqdn_mode = true

beSpec:
  replicas: 1
  image: apache/doris:be-4.1.4@sha256:08c139f3d0ec45090a5214fd76f19f84b871d05f1a2db83b5e35a85c193617b2
  requests:
    cpu: "4"
    memory: 8Gi
  limits:
    cpu: "8"
    memory: 16Gi
  persistentVolumes:
    - mountPath: /opt/apache-doris/be/storage
      name: be-storage
      persistentVolumeClaimSpec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 20Gi
    - mountPath: /opt/apache-doris/be/log
      name: be-log
      persistentVolumeClaimSpec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
  config: |
    storage_root_path = /opt/apache-doris/be/storage
    priority_networks = 10.0.0.0/8
    be_port = 9060
    webserver_port = 8040
    heartbeat_service_port = 9050
    brpc_port = 8060
    cumulative_compaction_num_threads_per_disk = 2
    base_compaction_num_threads_per_disk = 1
    max_compaction_threads = 10
    mem_limit = 90%
    streaming_load_max_mb = 10240
  # Set to false in production (this bypasses the BE startup check for nofile/nproc ulimits)
  skipUlimitCheck: true
