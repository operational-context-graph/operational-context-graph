{{- if .Values.enabled -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-doris-be-config
  labels:
    app.kubernetes.io/name: doris
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
data:
  be.conf: |
    {{- .Values.beSpec.config | nindent 4 }}
{{- end }}
