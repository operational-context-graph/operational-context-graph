# Fires after CI passes on main. For system releases: pushes a git tag, aliases the
# dev Helm chart to the release version, and creates a GitHub Release with the chart attached.
# No container image build. No Helm chart repackaging.
#
# Both release-component.yml and release-system.yml fire on every CI completion on main.
# This workflow exits cleanly when the merge was not a system release branch.
# zizmor: ignore[dangerous-triggers]
---
name: Release System

on:
  workflow_run:
    workflows: ["Continuous Integration"]
    types: [completed]
    branches: ["main"]

permissions:
  contents: read
  packages: read

jobs:
  detect:
    name: Detect Release
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      pull-requests: read
    outputs:
      release_type: ${{ steps.parse.outputs.release_type }}
      version: ${{ steps.parse.outputs.version }}
      tag: ${{ steps.parse.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Parse merge source branch
        id: parse
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          SOURCE_BRANCH=$(gh api \
            "repos/${REPO}/commits/${HEAD_SHA}/pulls" \
            --jq '.[0].head.ref // ""')
          echo "SOURCE_BRANCH=${SOURCE_BRANCH}"
          scripts/parse-release-branch.sh "${SOURCE_BRANCH}"
      - name: Log detected release
        env:
          RELEASE_TYPE: ${{ steps.parse.outputs.release_type }}
          VERSION: ${{ steps.parse.outputs.version }}
          TAG: ${{ steps.parse.outputs.tag }}
        run: |
          if [ -z "${RELEASE_TYPE}" ]; then
            echo "Not a release merge — all jobs will be skipped"
          else
            echo "release_type=${RELEASE_TYPE} version=${VERSION} tag=${TAG}"
          fi

  tag-system:
    name: Tag System Release
    needs: detect
    if: needs.detect.outputs.release_type == 'system'
    uses: $/.github/workflows/shared/push-release-tag.yml
    with:
      tag: "v${{ needs.detect.outputs.version }}"
      message: "chore(release): system v${{ needs.detect.outputs.version }}"
      client_id: ${{ vars.APP_CLIENT_ID }}
    secrets:
      private_key: ${{ secrets.APP_PRIVATE_KEY }}

  alias-release-artifacts:
    name: Alias Release Artifacts to Release Version
    runs-on: ubuntu-latest
    needs: [detect, tag-system]
    if: needs.detect.outputs.release_type == 'system'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install crane
        env:
          CRANE_VERSION: "v0.22.1"
          CRANE_SHA256: "0ab7a1d6932a213aed964ce97666c3077fe691c8606413674a8b3e0b9ec4cda0"
        run: |
          archive="go-containerregistry_Linux_x86_64.tar.gz"
          url="https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/${archive}"
          curl -fsSL -o "${archive}" "${url}"
          echo "${CRANE_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "${archive}" crane
          sudo mv crane /usr/local/bin/crane
          crane version
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Alias dev Helm chart to release version
        env:
          REGISTRY: ghcr.io/${{ github.repository_owner }}
          VERSION: ${{ needs.detect.outputs.version }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          COMMIT_DATE=$(gh api "repos/${REPO}/commits/${HEAD_SHA}" \
            --jq '.commit.committer.date' \
            | cut -c1-10 \
            | tr -d '-')
          DEV_TAG="dev.${COMMIT_DATE}-${HEAD_SHA:0:7}"
          src="${REGISTRY}/operational-context-graph/operational-context-graph:${DEV_TAG}"
          crane tag "${src}" "${VERSION}"
          echo "Aliased Helm chart ${src} → ${VERSION}"
          # TODO: alias OCM bundle when publish-ocm-bundle is implemented

  pull-helm-chart:
    name: Pull Helm Chart from OCI
    runs-on: ubuntu-latest
    needs: [detect, alias-release-artifacts]
    if: needs.detect.outputs.release_type == 'system'
    permissions:
      contents: read
      packages: read
    steps:
      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull Helm chart from OCI registry
        env:
          VERSION: ${{ needs.detect.outputs.version }}
          REGISTRY: ghcr.io/${{ github.repository_owner }}
        run: |
          helm pull \
            "oci://${REGISTRY}/operational-context-graph/operational-context-graph" \
            --version "${VERSION}"
          ls -la "operational-context-graph-${VERSION}.tgz"
      - name: Upload Helm chart artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ocg-helm-${{ needs.detect.outputs.version }}
          path: operational-context-graph-${{ needs.detect.outputs.version }}.tgz
          retention-days: 1

  generate-system-release-notes:
    name: Generate System Release Notes
    runs-on: ubuntu-latest
    needs: [detect, tag-system]
    if: needs.detect.outputs.release_type == 'system'
    permissions:
      contents: read
    outputs:
      notes: ${{ steps.notes.outputs.notes }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Build release notes
        id: notes
        env:
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          NOTES=$(awk '/^## \['"${VERSION}"'\]/{found=1; next} found && /^## /{exit} found{print}' CHANGELOG.md)
          printf 'notes<<EOF\n%s\nEOF\n' "${NOTES}" >> "$GITHUB_OUTPUT"

  github-release-system:
    name: Create System GitHub Release
    needs: [detect, pull-helm-chart, generate-system-release-notes]
    if: needs.detect.outputs.release_type == 'system'
    uses: $/.github/workflows/shared/create-github-release.yml
    with:
      tag: "v${{ needs.detect.outputs.version }}"
      title: "system v${{ needs.detect.outputs.version }}"
      notes: ${{ needs.generate-system-release-notes.outputs.notes }}
      artifacts: |
        ocg-helm-${{ needs.detect.outputs.version }}:operational-context-graph-${{ needs.detect.outputs.version }}.tgz#Helm chart
      client_id: ${{ vars.APP_CLIENT_ID }}
    secrets:
      private_key: ${{ secrets.APP_PRIVATE_KEY }}
