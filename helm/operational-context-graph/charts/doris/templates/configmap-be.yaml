{{- if .Values.enabled -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-doris-be-config
  labels:
    app.kubernetes.io/name: doris
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
data:
  be.conf: |
    storage_root_path = {{ .Values.beSpec.config.storageRootPath }}
    priority_networks = {{ .Values.beSpec.config.priorityNetworks }}
    be_port = {{ .Values.beSpec.config.bePort }}
    webserver_port = {{ .Values.beSpec.config.webserverPort }}
    heartbeat_service_port = {{ .Values.beSpec.config.heartbeatServicePort }}
    brpc_port = {{ .Values.beSpec.config.brpcPort }}
    cumulative_compaction_num_threads_per_disk = {{ .Values.beSpec.config.cumulativeCompactionThreads }}
    base_compaction_num_threads_per_disk = {{ .Values.beSpec.config.baseCompactionThreads }}
    max_compaction_threads = {{ .Values.beSpec.config.maxCompactionThreads }}
    mem_limit = {{ .Values.beSpec.config.memLimit }}
    streaming_load_max_mb = {{ .Values.beSpec.config.streamingLoadMaxMb }}
{{- end }}
