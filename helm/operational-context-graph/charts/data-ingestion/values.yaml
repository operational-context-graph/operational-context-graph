# Default values for the data-ingestion subchart.
enabled: true
replicaCount: 1

image:
  repository: ghcr.io/operational-context-graph/data-ingestion
  tag: "0.1.0"
  pullPolicy: IfNotPresent

# Container ports (match OCG_DI_SERVER_PORT and OCG_DI_GRPC__PORT defaults).
containerPort: 8080
grpcContainerPort: 9090

service:
  type: ClusterIP
  port: 8080
  grpcPort: 9090

# tls configures mTLS for the gRPC server.
# Set enabled: true and provide a secretName referencing a Secret with:
#   tls.crt  — server certificate PEM
#   tls.key  — server private key PEM
#   ca.crt   — CA certificate PEM used to verify client certificates
tls:
  enabled: false
  secretName: ""
  mountPath: /etc/tls

# PostgreSQL outbox connection. The password is never set here; it is read from
# a Kubernetes Secret via passwordSecret. For local/dev the umbrella chart points
# these at the bundled postgres subchart; for prod they point at the existing OCG
# instance.
database:
  host: ""
  port: 5432
  name: ocg
  user: ocg
  sslmode: require
  maxconns: 10
  passwordSecret:
    name: ""
    key: password

# Downstream store base URLs (OCG_DI_TELEMETRY_STORE__BASE_URL / OCG_DI_INVENTORY_STORE__BASE_URL).
# Override in values.local.yaml to match your Helm release name.
telemetryStore:
  baseURL: "http://telemetry-store:8080"

inventoryStore:
  baseURL: "http://inventory-store:8080"

resources: {}

nameOverride: ""
fullnameOverride: ""
