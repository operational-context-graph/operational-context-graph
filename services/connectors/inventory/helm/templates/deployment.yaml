apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "inventory-connector.fullname" . }}
  labels:
    {{- include "inventory-connector.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "inventory-connector.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "inventory-connector.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          {{- if .Values.image.digest }}
          image: "{{ .Values.image.repository }}@{{ .Values.image.digest }}"
          {{- else }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          {{- end }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
