apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "data-ingestion.fullname" . }}
  labels:
    {{- include "data-ingestion.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "data-ingestion.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "data-ingestion.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
              protocol: TCP
          env:
            - name: OCG_DI_DATABASE_HOST
              value: {{ .Values.database.host | quote }}
            - name: OCG_DI_DATABASE_PORT
              value: {{ .Values.database.port | quote }}
            - name: OCG_DI_DATABASE_NAME
              value: {{ .Values.database.name | quote }}
            - name: OCG_DI_DATABASE_USER
              value: {{ .Values.database.user | quote }}
            - name: OCG_DI_DATABASE_SSLMODE
              value: {{ .Values.database.sslmode | quote }}
            - name: OCG_DI_DATABASE_MAXCONNS
              value: {{ .Values.database.maxconns | quote }}
            - name: OCG_DI_DATABASE_OUTBOXTABLE
              value: {{ .Values.database.outboxtable | quote }}
            - name: OCG_DI_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ required "data-ingestion.database.passwordSecret.name is required" .Values.database.passwordSecret.name | quote }}
                  key: {{ .Values.database.passwordSecret.key | quote }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
