apiVersion: v2
name: operational-context-graph
description: Umbrella chart for the Operational Context Graph platform
type: application
version: 0.1.0
appVersion: "0.1.0"
dependencies:
  - name: data-ingestion
    version: 0.1.0
    condition: data-ingestion.enabled
  - name: postgresql
    version: 18.12.14
    repository: oci://registry-1.docker.io/bitnamicharts
    condition: postgresql.enabled
  - name: pgadmin
    version: 0.1.0
    condition: pgadmin.enabled
  - name: telemetry-store
    version: 0.1.0
    condition: telemetry-store.enabled
  - name: inventory-connector
    version: 0.1.0
    condition: inventory-connector.enabled
  - name: doris-operator
    version: 25.8.0
    repository: https://charts.selectdb.com
    condition: doris.enabled
  - name: doris
    version: 0.1.0
    condition: doris.enabled
  - name: otelcol
    version: 0.1.0
    condition: otelcol.enabled
