# Runs CI checks on every push and pull request targeting main.
# On pushes to main, also builds and publishes dev images, Helm chart, and OCM bundle
# to GHCR after all checks pass.
#
---
name: Continuous Integration

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch: ~

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize Go workspace
        run: make init
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"
      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          install-only: true
      - name: Run golangci-lint
        run: make lint-all

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize Go workspace
        run: make init
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"
      - name: Check go.mod tidy
        run: make tidy-check-all
      - name: Build
        run: make build-all

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize Go workspace
        run: make init
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"
      - name: Run tests
        # COVERAGE_THRESHOLD=0 disables the coverage gate in make test-all.
        # Coverage is checked separately below with continue-on-error so failures
        # post a PR comment rather than blocking the run during ramp-up.
        # Raise the threshold in the Makefile once baseline coverage is established.
        run: make test-all COVERAGE_THRESHOLD=0
      - name: Check coverage
        id: coverage
        run: make test-coverage-all
        continue-on-error: true
      - name: Post coverage comment
        if: steps.coverage.outcome == 'failure' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          threshold=$(grep -oP 'COVERAGE_THRESHOLD\s*:=\s*\K[0-9]+' Makefile)
          body=$(bash scripts/coverage-comment.sh coverage "${threshold:-20}")
          pr="${{ github.event.pull_request.number }}"
          repo="${{ github.repository }}"
          comment_id=$(gh api "repos/${repo}/issues/${pr}/comments" \
            --jq '[.[] | select(.body | startswith("<!-- coverage-report -->"))] | last | .id // empty')
          if [ -n "$comment_id" ]; then
            gh api "repos/${repo}/issues/comments/${comment_id}" -X PATCH -f body="$body"
          else
            gh pr comment "$pr" --body "$body"
          fi
      - name: Fail if coverage failed
        if: steps.coverage.outcome == 'failure'
        run: exit 1

  # Lints all subcharts using chart-testing (ct lint). ct discovers each subchart via its ci/
  # directory and passes every ci/*.yaml file as --values to helm lint. See helm/README.md.
  helm-lint:
    name: Helm Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0 — PIN: resolve SHA from github.com
        with:
          version: latest
      - name: Set up chart-testing
        uses: helm/chart-testing-action@720270857a28afd41e2426521a7801db09e9b510 # v2.9.0 — PIN: resolve SHA from github.com
      - name: Run chart-testing (lint)
        run: ct lint --all --chart-dirs helm/charts

  workspace-sync:
    name: Workspace Sync
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize Go workspace
        run: make init
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"
      - name: Check workspace sync
        run: make workspace-sync-check

  publish-dev:
    name: Publish Dev Images
    runs-on: ubuntu-latest
    needs: [test, workspace-sync]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write  # required: pushes container images and attestations to GHCR
      attestations: write
      id-token: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Resolve dev tag
        id: version
        run: |
          date=$(date -u +%Y%m%d)
          version="dev.${date}-${GITHUB_SHA:0:7}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Resolved dev tag: ${version}"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push all images
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          push: true
          provenance: true
          sbom: true
        env:
          VERSION: ${{ steps.version.outputs.version }}

  publish-helm:
    name: Publish Dev Helm Chart
    runs-on: ubuntu-latest
    needs: [publish-dev, helm-lint]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write  # required: helm push publishes the chart to GHCR via OCI
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to GHCR (Helm)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            --username "${{ github.repository_owner }}" \
            --password-stdin
      - name: Package and push Helm chart
        env:
          VERSION: ${{ needs.publish-dev.outputs.version }}
          REGISTRY: ghcr.io/${{ github.repository_owner }}
        run: |
          # helm package requires valid semver. dev.YYYYMMDD-SHA is not semver
          # (no MAJOR.MINOR.PATCH base), so prefix with 0.0.0- to satisfy the parser.
          # The OCI tag pushed to GHCR still uses VERSION unchanged.
          HELM_VERSION="0.0.0-${VERSION}"
          helm dependency update helm/
          helm package helm/ \
            --version "${HELM_VERSION}" \
            --app-version "${VERSION}"
          helm push "operational-context-graph-${HELM_VERSION}.tgz" \
            "oci://${REGISTRY}"

  publish-ocm-bundle:
    name: Publish Dev OCM Bundle
    runs-on: ubuntu-latest
    needs: [publish-helm]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    env:
      OCM_VERSION: "0.22.1"
      OCM_CLI_SHA256: "15532daec120686519dc3d122e078820114f2bd090b1ed3091e9bea6704339ca"
      REGISTRY: ghcr.io/${{ github.repository_owner }}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve dev version
        id: version
        run: |
          date=$(date -u +%Y%m%d)
          version="0.0.0-dev.${date}-${GITHUB_SHA:0:7}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Resolved OCM bundle dev version: ${version}"

      - name: Install OCM v2 CLI
        run: |
          curl -fsSL \
            "https://github.com/open-component-model/open-component-model/releases/download/v${OCM_VERSION}/ocm-linux-amd64" \
            -o /tmp/ocm-bin
          echo "${OCM_CLI_SHA256}  /tmp/ocm-bin" | sha256sum --check --status || {
            echo "ERROR: OCM CLI checksum mismatch"
            sha256sum /tmp/ocm-bin
            exit 1
          }
          install -m 0755 /tmp/ocm-bin /usr/local/bin/ocm
          ocm version

      - name: Install tools (helm, yq, skopeo)
        run: |
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          curl -fsSL "https://github.com/mikefarah/yq/releases/download/v4.44.6/yq_linux_amd64" \
            -o /usr/local/bin/yq
          chmod +x /usr/local/bin/yq
          sudo apt-get install -y skopeo

      - name: Write signing key
        env:
          OCM_SIGNING_KEY: ${{ secrets.OCM_SIGNING_KEY }}
        run: |
          printf '%s' "${OCM_SIGNING_KEY}" > /tmp/ocg-signing-key.pem
          chmod 600 /tmp/ocg-signing-key.pem

      - name: Pull service images as OCI layout tarballs
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Images are tagged with the same dev.YYYYMMDD-SHA formula as publish-dev
          date=$(date -u +%Y%m%d)
          IMG_TAG="dev.${date}-${GITHUB_SHA:0:7}"
          mkdir -p bin/images
          for svc in data-ingestion inventory-store telemetry-store inventory-connector; do
            skopeo copy \
              --src-creds "${GITHUB_ACTOR}:${GHCR_TOKEN}" \
              "docker://${REGISTRY}/${svc}:${IMG_TAG}" \
              "oci-archive:bin/images/${svc}.oci.tar"
          done

      - name: Build and sign OCM bundle
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: VERSION="${VERSION}" SIGN_KEY=/tmp/ocg-signing-key.pem make ocm-build

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push CTF to GHCR as OCI
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ocm transfer component-version \
            ctf::./bin/ctf// \
            "oci::${REGISTRY}/operational-context-graph"
          echo "Pushed OCM bundle to ${REGISTRY}/operational-context-graph (${VERSION})"
