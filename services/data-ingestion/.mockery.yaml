# Optional mockery configuration (github.com/vektra/mockery).
# Generated mocks use testify/mock, so they introduce no new paradigm.
# Run `make mocks` to regenerate. Adopt per component only where interfaces
# are large or change frequently.
dir: internal/ingest
filename: mocks_test.go
structname: '{{.InterfaceName}}'
pkgname: ingest_test
template: testify
template-data:
  unroll-variadic: true
packages:
  github.com/operational-context-graph/operational-context-graph/services/data-ingestion/internal/ingest:
    interfaces:
      OutboxWriter: {}
      SchemaRegistryClient: {}
      SourceMappingExecutionEngine: {}
