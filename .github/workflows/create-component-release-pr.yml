# Creates a release PR for a single component.
#
# Validates the component path and version, derives the release tag and branch,
# generates the changelog using git-cliff, and opens a PR against main with the
# changelog diff as the PR body.
---
name: Create Component Release PR
run-name: "Release PR Creation ${{ inputs.component_path }} v${{ inputs.version }}"

on:
  workflow_dispatch:
    inputs:
      component_path:
        description: "Component path (e.g. services/data-ingestion, gen/go)"
        required: true
        type: string
      version:
        description: "Version to release (e.g. 1.0.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.derive.outputs.tag }}
      branch: ${{ steps.derive.outputs.branch }}
      slug: ${{ steps.derive.outputs.slug }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate version format
        env:
          VERSION: ${{ inputs.version }}
        run: scripts/validate-version.sh "$VERSION"
      - name: Validate component path
        env:
          COMPONENT_PATH: ${{ inputs.component_path }}
        run: |
          if [ ! -d "$COMPONENT_PATH" ]; then
            echo "::error::Component path '$COMPONENT_PATH' does not exist"
            exit 1
          fi
          if [ ! -f "$COMPONENT_PATH/go.mod" ] && \
             [ ! -f "$COMPONENT_PATH/package.json" ] && \
             [ ! -f "$COMPONENT_PATH/pyproject.toml" ]; then
            echo "::error::Component path '$COMPONENT_PATH' has no recognizable module manifest (go.mod, package.json, pyproject.toml)"
            exit 1
          fi
      - name: Check tag does not already exist
        env:
          COMPONENT_PATH: ${{ inputs.component_path }}
          VERSION: ${{ inputs.version }}
        run: |
          TAG="${COMPONENT_PATH}/v${VERSION}"
          if git tag --list | grep -qxF "$TAG"; then
            echo "::error::Tag '$TAG' already exists"
            exit 1
          fi
      - name: Derive release metadata
        id: derive
        env:
          COMPONENT_PATH: ${{ inputs.component_path }}
          VERSION: ${{ inputs.version }}
        run: |
          SLUG=$(basename "$COMPONENT_PATH")
          echo "tag=${COMPONENT_PATH}/v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "branch=release/${SLUG}/${VERSION}" >> "$GITHUB_OUTPUT"
          echo "slug=${SLUG}" >> "$GITHUB_OUTPUT"
          echo "Tag:    ${COMPONENT_PATH}/v${VERSION}"
          echo "Branch: release/${SLUG}/${VERSION}"
          echo "Slug:   ${SLUG}"

  create-release-pr:
    name: Create Component Release PR
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: write
      pull-requests: write
    env:
      TAG: ${{ needs.validate.outputs.tag }}
      BRANCH: ${{ needs.validate.outputs.branch }}
      SLUG: ${{ needs.validate.outputs.slug }}
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true
          fetch-depth: 0
      - name: Configure git identity
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          APP_USER_ID=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          scripts/configure-git-identity.sh "$APP_SLUG" "$APP_USER_ID"

      - name: Create release branch
        run: git checkout -b "$BRANCH"

      # TODO: Add version descriptor bump here for non-Go components in the future.
      # Python (pyproject.toml) and TypeScript (package.json) components need their
      # version field updated to match the release version.

      - name: Install git-cliff
        env:
          GIT_CLIFF_VERSION: ${{ vars.GIT_CLIFF_VERSION }}
        run: sudo scripts/install-git-cliff.sh "$GIT_CLIFF_VERSION"

      - name: Generate changelog
        id: changelog
        env:
          COMPONENT_PATH: ${{ inputs.component_path }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          pr_body=$(scripts/generate-component-changelog.sh \
            "$COMPONENT_PATH" \
            "$TAG")
          echo "pr_body<<EOF" >> "$GITHUB_OUTPUT"
          echo "$pr_body" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Commit changelog
        env:
          COMPONENT_PATH: ${{ inputs.component_path }}
          VERSION: ${{ inputs.version }}
        run: |
          git add "$COMPONENT_PATH/CHANGELOG.md"
          git diff --cached --quiet || git commit -m "chore(release): update ${SLUG} changelog for v${VERSION}"

      - name: Open release PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ inputs.version }}
          PR_BODY: ${{ steps.changelog.outputs.pr_body }}
        run: |
          git push origin "$BRANCH"
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore(release): ${SLUG} v${VERSION}" \
            --body "$PR_BODY"
