{{- $secretName := .Values.migratorSecretName | default .Values.secretName -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "inventory-store.fullname" . }}-migrate
  labels:
    {{- include "inventory-store.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "inventory-store.name" . }}-migrate
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsUser: 1000
        runAsNonRoot: true
      containers:
        - name: migrate
          image: "{{ .Values.migrator.image.repository }}:{{ .Values.migrator.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.migrator.image.pullPolicy }}
          envFrom:
            - secretRef:
                name: {{ $secretName }}
