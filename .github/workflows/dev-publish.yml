# Builds and pushes all component images to GHCR on every push to main,
# after CI passes. Images are tagged as dev.<run_number>-<date>-<sha>.
#
# A separate weekly workflow (dev-image-cleanup.yml) deletes versions older
# than 7 days that carry this prefix.
---
name: Publish Dev Images

on:
  workflow_run:
    workflows: ["Continuous Integration"]
    branches: ["main"]
    types: [completed]

permissions:
  contents: read

jobs:
  publish:
    name: Build and Push
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-packages: write
      - name: Resolve dev tag
        id: version
        run: |
          date=$(date -u +%Y%m%d)
          sha="${{ github.event.workflow_run.head_sha }}"
          version="dev.${{ github.run_number }}-${date}-${sha:0:7}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Resolved dev tag: ${version}"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0
      - name: Log in to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ steps.app-token.outputs.app-slug }}
          password: ${{ steps.app-token.outputs.token }}
      - name: Build and push all images
        uses: docker/bake-action@37816e747588cb78e2ec06b6a9b8bb5a1e1b6f74 # v6.8.0
        with:
          push: true
        env:
          VERSION: ${{ steps.version.outputs.version }}
