---
name: Buf

on:
  pull_request:
    branches: ["main"]
    paths:
      - "proto/**"
      - "buf.yaml"
      - "buf.gen.yaml"
      - ".github/workflows/buf.yaml"
  workflow_dispatch: ~

permissions:
  contents: read
  pull-requests: write

jobs:
  buf-check:
    name: Buf Check (Lint/Format/Breaking Changes)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # buf-action runs lint, format, and breaking changes check
      # Add label "buf skip breaking" to your PR to bypass breaking changes
      - name: Buf
        uses: bufbuild/buf-action@85aebf73123b5c15fd5528aaecbf9129cddf7fa7 # v1.6.0
