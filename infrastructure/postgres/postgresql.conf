# PostgreSQL configuration for OCG Inventory Store
# Production-grade settings — tuned for a small dedicated instance.

# Connection settings
listen_addresses = '*'
port = 5432
max_connections = 100

# Authentication
password_encryption = scram-sha-256

# Memory
shared_buffers = 256MB
work_mem = 4MB
maintenance_work_mem = 64MB

# WAL / durability
wal_level = replica
fsync = on
synchronous_commit = on

# Logging
log_destination = 'stderr'
logging_collector = off
log_min_duration_statement = 1000
log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '
log_connections = on
log_disconnections = on

# Locale
timezone = 'UTC'
lc_messages = 'en_US.UTF-8'
