version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/operational-context-graph/operational-context-graph/gen/go
inputs:
  - directory: proto
plugins:
  - remote: buf.build/protocolbuffers/go
    out: gen/go
    opt: paths=source_relative
  - remote: buf.build/grpc/go
    out: gen/go
    opt:
      - paths=source_relative
