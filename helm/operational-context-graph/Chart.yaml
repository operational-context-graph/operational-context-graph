apiVersion: v2
name: operational-context-graph
description: Umbrella chart for the Operational Context Graph platform
type: application
version: 0.1.0
appVersion: "0.1.0"
dependencies:
  - name: data-ingestion
    version: 0.1.0
    condition: data-ingestion.enabled
  - name: postgresql
    version: 18.12.14
    repository: oci://registry-1.docker.io/bitnamicharts
    condition: postgresql.enabled
  - name: pgadmin
    version: 0.1.0
    condition: pgadmin.enabled
