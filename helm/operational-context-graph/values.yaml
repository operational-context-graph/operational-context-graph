global: {}

postgresql:
  enabled: true
  auth:
    existingSecret: postgres-secret
    secretKeys:
      adminPasswordKey: password
    username: ocg
    database: ocg
  primary:
    persistence:
      size: 10Gi
      storageClass: ""
    extendedConfiguration: |
      password_encryption = scram-sha-256

pgadmin:
  enabled: false
  image:
    repository: dpage/pgadmin4
    tag: "8"
    pullPolicy: IfNotPresent
  secretName: pgadmin-secret
  service:
    port: 80

data-ingestion:
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/operational-context-graph/data-ingestion
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8080
  database:
    host: ocg-postgresql
    port: 5432
    name: ocg
    user: ocg
    sslmode: disable
    maxconns: 10
    passwordSecret:
      name: postgres-secret
      key: password
