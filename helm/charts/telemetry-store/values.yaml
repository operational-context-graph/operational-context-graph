# Default values for the telemetry-store subchart.
enabled: true
replicaCount: 3

image:
  repository: ghcr.io/operational-context-graph/telemetry-store
  tag: "0.0.1"
  digest: ""
  pullPolicy: IfNotPresent

# Container port the service listens on (matches HTTP_PORT default).
containerPort: 8080
metricsPort: 8081

service:
  type: ClusterIP
  port: 8080
  metricsPort: 8081

# Name of the pre-existing Kubernetes Secret holding Doris write credentials:
#   DORIS_STREAM_LOAD_URL, DORIS_STREAM_LOAD_USER, DORIS_STREAM_LOAD_PASSWORD.
# The Secret must be created before installing this chart.
dorisSecretName: telemetry-store-doris-secret

# Name of the pre-existing Kubernetes Secret holding Doris read credentials:
#   DORIS_DSN.
# The Secret must be created before installing this chart.
dorisReadSecretName: telemetry-store-doris-read-secret

# Name of the pre-existing Kubernetes Secret holding the Doris root password for the migration init container.
# The secret must provide DORIS_MIGRATE_PASSWORD — the Doris root password used by the mysql:8 init container.
# Leave DORIS_MIGRATE_PASSWORD empty before the first BE registers; set it once the cluster is up.
# The migration init container runs before the service container starts.
# The Secret must be created before installing this chart.
dorisMigratorSecretName: telemetry-store-doris-ddl-secret

# Doris FE connection settings used by the migration init container.
# Override feServiceHost when deploying under a release name other than "ocg".
doris:
  feServiceHost: "ocg-doris-fe-service"
  feServicePort: 9030

env:
  HTTP_PORT: "8080"
  LOG_LEVEL: "info"
  # replication_num: 3 for production.
  # Override to "1" for a single-BE dev cluster.
  DORIS_REPLICATION_NUM: "3"
  DORIS_BUCKETS: "10"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

resources: {}

nameOverride: ""
fullnameOverride: ""
