# Local/dev overrides: bundle a throwaway PostgreSQL and point the service at it.
postgres:
  enabled: true
  fullnameOverride: ocg-postgres
  secretName: ocg-postgres
  # Password is never stored here. Create the secret once before deploying:
  #   kubectl create secret generic ocg-postgres --from-literal=POSTGRES_PASSWORD=<your-password>

data-ingestion:
  image:
    repository: data-ingestion
    tag: dev
    pullPolicy: Never
  database:
    host: ocg-postgres
    port: 5432
    name: postgres
    user: postgres
    sslmode: disable
    maxconns: 10
    passwordSecret:
      name: ocg-postgres
      key: POSTGRES_PASSWORD
