# Fires after CI passes on main. Pushes a git tag and aliases the dev image to the
# release version tag for component releases. No container image build.
# No GitHub Release created for components.
#
# Both release-component.yml and release-system.yml fire on every CI completion on main.
# This workflow exits cleanly when the merge was not a component release branch.
---
name: Release Component

on:
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: ["Continuous Integration"]
    types: [completed]
    branches: ["main"]

permissions:
  contents: read

jobs:
  detect:
    name: Detect Release
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      pull-requests: read
    outputs:
      release_type: ${{ steps.parse.outputs.release_type }}
      slug: ${{ steps.parse.outputs.slug }}
      version: ${{ steps.parse.outputs.version }}
      tag: ${{ steps.parse.outputs.tag }}
      has_dockerfile: ${{ steps.parse.outputs.has_dockerfile }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Parse merge source branch
        id: parse
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          SOURCE_BRANCH=$(gh api \
            "repos/${REPO}/commits/${HEAD_SHA}/pulls" \
            --jq '.[0].head.ref // ""')
          echo "SOURCE_BRANCH=${SOURCE_BRANCH}"
          scripts/parse-release-branch.sh "${SOURCE_BRANCH}"
      - name: Log detected release
        env:
          RELEASE_TYPE: ${{ steps.parse.outputs.release_type }}
          SLUG: ${{ steps.parse.outputs.slug }}
          VERSION: ${{ steps.parse.outputs.version }}
          TAG: ${{ steps.parse.outputs.tag }}
        run: |
          if [ -z "${RELEASE_TYPE}" ]; then
            echo "Not a release merge — all jobs will be skipped"
          else
            echo "release_type=${RELEASE_TYPE} slug=${SLUG} version=${VERSION} tag=${TAG}"
          fi

  tag-component:
    name: Tag Component
    needs: detect
    if: needs.detect.outputs.release_type == 'component'
    uses: $/.github/workflows/shared/push-release-tag.yml
    with:
      tag: ${{ needs.detect.outputs.tag }}
      message: "chore(release): ${{ needs.detect.outputs.slug }} v${{ needs.detect.outputs.version }}"
      client_id: ${{ vars.APP_CLIENT_ID }}
    secrets:
      private_key: ${{ secrets.APP_PRIVATE_KEY }}

  alias-component-image:
    name: Alias Component Image to Release Version
    runs-on: ubuntu-latest
    needs: [detect, tag-component]
    if: |
      needs.detect.outputs.release_type == 'component' &&
      needs.detect.outputs.has_dockerfile == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Install crane
        env:
          CRANE_VERSION: "v0.22.1"
          CRANE_SHA256: "0ab7a1d6932a213aed964ce97666c3077fe691c8606413674a8b3e0b9ec4cda0"
        run: |
          archive="go-containerregistry_Linux_x86_64.tar.gz"
          url="https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/${archive}"
          curl -fsSL -o "${archive}" "${url}"
          echo "${CRANE_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "${archive}" crane
          sudo mv crane /usr/local/bin/crane
          crane version
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Alias dev image to release version
        env:
          REGISTRY: ghcr.io/${{ github.repository_owner }}
          SLUG: ${{ needs.detect.outputs.slug }}
          VERSION: ${{ needs.detect.outputs.version }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          COMMIT_DATE=$(gh api "repos/${REPO}/commits/${HEAD_SHA}" \
            --jq '.commit.committer.date' \
            | cut -c1-10 \
            | tr -d '-')
          DEV_TAG="dev.${COMMIT_DATE}-${HEAD_SHA:0:7}"
          src="${REGISTRY}/${SLUG}:${DEV_TAG}"
          crane tag "${src}" "${VERSION}"
          crane tag "${src}" "${VERSION}-${HEAD_SHA:0:7}"
          echo "Aliased ${src} → ${VERSION}, ${VERSION}-${HEAD_SHA:0:7}"
