# Doris Backend configuration for OCG Telemetry Store
# Production-grade settings tuned for high-throughput ingestion.

# Storage path (must match the volume mount in the container)
storage_root_path = /opt/apache-doris/be/storage

# Network — fixed subnet from dev.yml so Stream Load 307 redirects resolve correctly
priority_networks = 172.28.1.0/24

# Ports (must match the container port definitions)
be_port = 9060
webserver_port = 8040
heartbeat_service_port = 9050
brpc_port = 8060

# Compaction — tuned for high-throughput telemetry ingestion
cumulative_compaction_num_threads_per_disk = 2
base_compaction_num_threads_per_disk = 1
max_compaction_threads = 10

# Memory — leave headroom below the 16Gi container limit
mem_limit = 90%

# Ingestion
streaming_load_max_mb = 10240
priority_networks = 172.28.1.0/24
