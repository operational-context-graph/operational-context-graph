apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "inventory-store.fullname" . }}
  labels:
    {{- include "inventory-store.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "inventory-store.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "inventory-store.selectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        runAsUser: 1000
        runAsNonRoot: true
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          envFrom:
            - secretRef:
                name: {{ .Values.secretName }}
          env:
            - name: HTTP_PORT
              value: {{ .Values.env.HTTP_PORT | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.env.LOG_LEVEL | quote }}
            - name: DB_MAX_OPEN_CONNS
              value: {{ .Values.db.maxOpenConns | quote }}
            - name: DB_MAX_IDLE_CONNS
              value: {{ .Values.db.maxIdleConns | quote }}
            - name: DB_CONN_MAX_LIFETIME
              value: {{ .Values.db.connMaxLifetime | quote }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
