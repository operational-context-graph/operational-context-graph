apiVersion: apps/v1
kind: Deployment
metadata:
  name: ocg-telemetry-store
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: ocg-telemetry-store
    app.kubernetes.io/managed-by: Helm
    ccloud/service: {{ .Values.labels.service }}
    ccloud/support-group: {{ .Values.labels.supportGroup }}
spec:
  replicas: {{ .Values.telemetryStore.replicas }}
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: ocg-telemetry-store
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ocg-telemetry-store
    spec:
      securityContext:
        runAsUser: 1000
        runAsNonRoot: true
      containers:
        - name: telemetry-store
          image: "{{ .Values.registry }}/{{ .Values.telemetryStore.image }}:{{ .Values.telemetryStore.tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: {{ .Values.telemetryStore.port }}
          env:
            - name: HTTP_PORT
              value: "{{ .Values.telemetryStore.port }}"
            - name: LOG_LEVEL
              value: "{{ .Values.logLevel }}"
            - name: DORIS_FE_HOST
              value: "ocg-doris-fe:{{ .Values.doris.fe.httpPort }}"
            - name: DORIS_MYSQL_HOST
              value: "ocg-doris-fe:{{ .Values.doris.fe.mysqlPort }}"
            - name: DORIS_USER
              value: "{{ .Values.doris.writerUser }}"
            - name: DORIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ocg-doris-credentials
                  key: writer-password
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.telemetryStore.port }}
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: {{ .Values.telemetryStore.port }}
            # Longer delay — waits for Doris migrations to complete
            initialDelaySeconds: 30
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ocg-telemetry-store
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: ocg-telemetry-store
    app.kubernetes.io/managed-by: Helm
    ccloud/service: {{ .Values.labels.service }}
    ccloud/support-group: {{ .Values.labels.supportGroup }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ocg-telemetry-store
  ports:
    - name: http
      port: {{ .Values.telemetryStore.port }}
      targetPort: {{ .Values.telemetryStore.port }}
