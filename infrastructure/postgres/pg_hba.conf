# pg_hba.conf — client authentication for OCG Inventory Store
#
# TYPE  DATABASE  USER      ADDRESS       METHOD
# Local connections (used by pg_isready health check)
local   all       postgres                peer
local   all       all                     peer
# Remote connections — scram-sha-256 only, no md5
host    all       all       0.0.0.0/0     scram-sha-256
host    all       all       ::/0          scram-sha-256
