apiVersion: apps/v1
kind: Deployment
metadata:
  name: ocg-data-ingestion
  namespace: autonomous-operations
  labels:
    app.kubernetes.io/name: ocg-data-ingestion
    app.kubernetes.io/managed-by: Helm
    ccloud/service: operational-context-graph
    ccloud/support-group: cross-product
spec:
  replicas: {{ .Values.dataIngestion.replicas }}
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: ocg-data-ingestion
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ocg-data-ingestion
    spec:
      securityContext:
        runAsUser: 1000
        runAsNonRoot: true
      containers:
        - name: data-ingestion
          image: "{{ .Values.registry }}/{{ .Values.dataIngestion.image }}:{{ .Values.dataIngestion.tag }}"
          imagePullPolicy: IfNotPresent
          env:
            - name: INVENTORY_STORE_URL
              value: "http://ocg-inventory-store:8080"
            - name: TELEMETRY_STORE_URL
              value: "http://ocg-telemetry-store:8080"
            - name: LOG_LEVEL
              value: "info"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
