# Runs CI checks on every push and pull request targeting main.
# On pushes to main, also builds and publishes dev images, Helm chart, and OCM bundle
# to GHCR after all checks pass.
#
# Artifact aliasing (dev.* → release version) happens in release-component.yml and
# release-system.yml after CI completes on a release branch merge.
---
name: Continuous Integration

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch: ~

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize Go workspace
        run: make init
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"
      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          install-only: true
      - name: Run golangci-lint
        run: make lint-all

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize Go workspace
        run: make init
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"
      - name: Check go.mod tidy
        run: make tidy-check-all
      - name: Build
        run: make build-all

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize Go workspace
        run: make init
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"
      - name: Run tests
        run: make test-all

  # Lints all subcharts using chart-testing (ct lint). ct discovers each subchart via its ci/
  # directory and passes every ci/*.yaml file as --values to helm lint. See helm/README.md.
  helm-lint:
    name: Helm Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1 — PIN: resolve SHA from github.com
        with:
          version: latest
      - name: Set up chart-testing
        uses: helm/chart-testing-action@720270857a28afd41e2426521a7801db09e9b510 # v2.9.0 — PIN: resolve SHA from github.com
      - name: Run chart-testing (lint)
        run: ct lint --all --chart-dirs helm/charts

  workspace-sync:
    name: Workspace Sync
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize Go workspace
        run: make init
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"
      - name: Check workspace sync
        run: make workspace-sync-check

  publish-dev:
    name: Publish Dev Images
    runs-on: ubuntu-latest
    needs: [test, workspace-sync]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Resolve dev tag
        id: version
        run: |
          date=$(date -u +%Y%m%d)
          version="dev.${date}-${GITHUB_SHA:0:7}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Resolved dev tag: ${version}"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push all images
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          push: true
          provenance: true
          sbom: true
        env:
          VERSION: ${{ steps.version.outputs.version }}

  publish-helm:
    name: Publish Dev Helm Chart
    runs-on: ubuntu-latest
    needs: [publish-dev, helm-lint]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Package and push Helm chart
        env:
          VERSION: ${{ needs.publish-dev.outputs.version }}
          REGISTRY: ghcr.io/${{ github.repository_owner }}
        run: |
          helm dependency update helm/
          helm package helm/ \
            --version "${VERSION}" \
            --app-version "${VERSION}"
          helm push "operational-context-graph-${VERSION}.tgz" \
            "oci://${REGISTRY}/operational-context-graph"

  # TODO: implement OCM bundle packaging (separate PR/branch).
  # Placeholder wired into dependency graph so the system alias job
  # does not need a second PR when OCM support lands.
  publish-ocm-bundle:
    name: Publish Dev OCM Bundle (placeholder)
    runs-on: ubuntu-latest
    needs: [publish-helm]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.placeholder.outputs.digest }}
    steps:
      - name: Placeholder - OCM bundle not yet implemented
        id: placeholder
        run: |
          echo "TODO: implement OCM bundle packaging"
          echo "digest=" >> "$GITHUB_OUTPUT"
