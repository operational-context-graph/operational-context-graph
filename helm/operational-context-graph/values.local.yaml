# Local/dev overrides.
# Create the secret before deploying:
#   kubectl create secret generic postgres-secret --from-literal=password=<your-password>
postgresql:
  primary:
    persistence:
      size: 1Gi

inventory-store:
  image:
    repository: localhost:5001/inventory-store
    tag: local
    pullPolicy: Always
  database:
    host: ocg-postgresql
    sslmode: disable
    passwordSecret:
      name: postgres-secret
      key: password

data-ingestion:
  image:
    repository: localhost:5001/data-ingestion
    tag: local
    pullPolicy: Always
  database:
    host: ocg-postgresql
    sslmode: disable
    passwordSecret:
      name: postgres-secret
      key: password
  inventoryStore:
    baseURL: "http://ocg-inventory-store:8080"

telemetry-store:
  replicaCount: 1
  env:
    DORIS_REPLICATION_NUM: "1"

inventory-connector:
  image:
    repository: inventory-connector
    tag: dev
    pullPolicy: Never
  netbox:
    baseURL: "http://mockreplay-netbox:8081"
    tokenSecret:
      name: netbox-token
