data-ingestion:
  image:
    repository: data-ingestion
    tag: dev
    pullPolicy: Never

telemetry-store:
  replicaCount: 1
  env:
    DORIS_REPLICATION_NUM: "1"

inventory-connector:
  image:
    repository: inventory-connector
    tag: dev
    pullPolicy: Never
  netbox:
    baseURL: "http://mockreplay-netbox:8081"
    tokenSecret:
      name: netbox-token
