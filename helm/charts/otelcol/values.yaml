enabled: true
replicaCount: 1

nameOverride: ""
fullnameOverride: ""

image:
  repository: otel/opentelemetry-collector
  tag: "0.164.0@sha256:28b6d41ac51bff6b41ba5e8fe503569ffb9d6a1ea90f7a78419e86f34e44f750"
  digest: ""
  pullPolicy: IfNotPresent

# Port the collector listens on for OTLP/HTTP.
containerPort: 4318
metricsPort: 8081

service:
  type: ClusterIP
  port: 4318
  metricsPort: 8081

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

# Endpoint of the data-ingestion gRPC receiver (OTLP/gRPC, no TLS).
dataIngestionEndpoint: "ocg-data-ingestion:9090"

resources: {}
