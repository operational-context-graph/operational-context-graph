apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ocg-doris-fe
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: ocg-doris-fe
    app.kubernetes.io/managed-by: Helm
    ccloud/service: {{ .Values.labels.service }}
    ccloud/support-group: {{ .Values.labels.supportGroup }}
spec:
  serviceName: ocg-doris-fe
  replicas: {{ .Values.doris.fe.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: ocg-doris-fe
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ocg-doris-fe
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: doris-fe
          image: "{{ .Values.registry }}/{{ .Values.doris.fe.image }}:{{ .Values.doris.fe.tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: {{ .Values.doris.fe.httpPort }}
            - name: mysql
              containerPort: {{ .Values.doris.fe.mysqlPort }}
            - name: thrift
              containerPort: {{ .Values.doris.fe.thriftPort }}
            - name: bdb
              containerPort: {{ .Values.doris.fe.bdbPort }}
          env:
            - name: DORIS_WRITER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ocg-doris-credentials
                  key: writer-password
            - name: DORIS_ANALYST_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ocg-doris-credentials
                  key: analyst-password
          livenessProbe:
            httpGet:
              path: /api/bootstrap
              port: {{ .Values.doris.fe.httpPort }}
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/bootstrap
              port: {{ .Values.doris.fe.httpPort }}
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            - name: fe-meta
              mountPath: /opt/apache-doris/fe/doris-meta
  volumeClaimTemplates:
    - metadata:
        name: fe-meta
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: "{{ .Values.doris.fe.storage }}"
---
apiVersion: v1
kind: Service
metadata:
  name: ocg-doris-fe
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: ocg-doris-fe
    app.kubernetes.io/managed-by: Helm
    ccloud/service: {{ .Values.labels.service }}
    ccloud/support-group: {{ .Values.labels.supportGroup }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ocg-doris-fe
  ports:
    - name: http
      port: {{ .Values.doris.fe.httpPort }}
      targetPort: {{ .Values.doris.fe.httpPort }}
    - name: mysql
      port: {{ .Values.doris.fe.mysqlPort }}
      targetPort: {{ .Values.doris.fe.mysqlPort }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ocg-doris-be
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: ocg-doris-be
    app.kubernetes.io/managed-by: Helm
    ccloud/service: {{ .Values.labels.service }}
    ccloud/support-group: {{ .Values.labels.supportGroup }}
spec:
  serviceName: ocg-doris-be
  replicas: {{ .Values.doris.be.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: ocg-doris-be
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ocg-doris-be
    spec:
      # BE requires vm.max_map_count >= 2000000 on the host — set via init container
      initContainers:
        - name: set-max-map-count
          image: busybox
          securityContext:
            privileged: true
          command: ["sysctl", "-w", "vm.max_map_count=2000000"]
      securityContext:
        runAsNonRoot: true
      containers:
        - name: doris-be
          image: "{{ .Values.registry }}/{{ .Values.doris.be.image }}:{{ .Values.doris.be.tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - name: be-http
              containerPort: {{ .Values.doris.be.httpPort }}
            - name: heartbeat
              containerPort: {{ .Values.doris.be.heartbeatPort }}
            - name: thrift
              containerPort: {{ .Values.doris.be.thriftPort }}
            - name: brpc
              containerPort: {{ .Values.doris.be.brpcPort }}
          livenessProbe:
            httpGet:
              path: /api/health
              port: {{ .Values.doris.be.httpPort }}
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: {{ .Values.doris.be.httpPort }}
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "1"
              memory: 4Gi
            limits:
              cpu: "4"
              memory: 16Gi
          volumeMounts:
            - name: be-storage
              mountPath: /opt/apache-doris/be/storage
  volumeClaimTemplates:
    - metadata:
        name: be-storage
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: "{{ .Values.doris.be.storage }}"
---
apiVersion: v1
kind: Service
metadata:
  name: ocg-doris-be
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: ocg-doris-be
    app.kubernetes.io/managed-by: Helm
    ccloud/service: {{ .Values.labels.service }}
    ccloud/support-group: {{ .Values.labels.supportGroup }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ocg-doris-be
  ports:
    - name: be-http
      port: {{ .Values.doris.be.httpPort }}
      targetPort: {{ .Values.doris.be.httpPort }}
    - name: heartbeat
      port: {{ .Values.doris.be.heartbeatPort }}
      targetPort: {{ .Values.doris.be.heartbeatPort }}
