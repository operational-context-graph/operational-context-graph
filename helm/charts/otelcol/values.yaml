enabled: true
replicaCount: 1

nameOverride: ""
fullnameOverride: ""

image:
  repository: otel/opentelemetry-collector
  tag: "0.165.0@sha256:34b24b740c3c88d3467740e8642a397c13898ef76d7295c5425164c482ed1b73"
  digest: ""
  pullPolicy: IfNotPresent

# Port the collector listens on for OTLP/HTTP.
containerPort: 4318
metricsPort: 8081

service:
  type: ClusterIP
  port: 4318
  metricsPort: 8081

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

# Endpoint of the data-ingestion gRPC receiver (OTLP/gRPC, no TLS).
dataIngestionEndpoint: "ocg-data-ingestion:9090"

resources: {}
