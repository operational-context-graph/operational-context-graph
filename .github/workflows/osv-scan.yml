# Scans all dependency manifests in the repository using OSV-Scanner. Runs on
# every push to main and on a daily schedule. PR diff scanning runs separately
# via osv-scan-pr.yml.
# Docs: https://google.github.io/osv-scanner/github-action/
---
name: OSV-Scanner

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "25 5 * * *"
  workflow_dispatch: ~

jobs:
  osv-scan:
    name: OSV-Scanner
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
    permissions:
      actions: read
      contents: read
      security-events: write
