# Doris Frontend configuration for OCG Telemetry Store
# Production-grade settings.

# Metadata storage path (must match the volumeMount in the Helm StatefulSet)
meta_dir = /opt/apache-doris/fe/doris-meta

# Network — bind to all interfaces so Kubernetes pods can reach FE
priority_networks = 0.0.0.0/0

# Ports (must match the containerPorts in doris-statefulset.yaml)
http_port = 8030
rpc_port = 9020
query_port = 9030
edit_log_port = 9010

# JVM heap — tune based on available node memory
# 4g is appropriate for the 4Gi memory limit in values-prod.yaml
JAVA_OPTS = "-Xmx4096m -Xms4096m"

# Query timeout (seconds)
query_timeout = 300

# Stream Load timeout (seconds)
stream_load_default_timeout_second = 600
