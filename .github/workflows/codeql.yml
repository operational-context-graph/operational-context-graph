---
name: "CodeQL Advanced"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "20 8 * * *"

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ (matrix.language == 'swift' && 'macos-latest') || 'ubuntu-latest' }}
    permissions:
      security-events: write
      # required to fetch internal or private CodeQL packs
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            # `build-mode: autobuild` fails in this go.work monorepo because it has no go.mod.
            # We build each module ourselves (see the build step below).
            build-mode: manual
          # TODO: enable when JavaScript/TypeScript support is needed
          # - language: javascript-typescript
          #   build-mode: none
        # Actions workflow scanning is handled by the zizmor workflow.
        # CodeQL supports: 'c-cpp', 'csharp', 'go', 'java-kotlin', 'javascript-typescript', 'python', 'ruby', 'rust', 'swift'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Add any setup steps before running the `github/codeql-action/init` action.
      # This includes steps like installing compilers or runtimes (`actions/setup-node`
      # or others).

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-and-quality

      # Manual build for Go: CodeQL traces this build to extract the database.
      # Build every module so new services are covered without editing this file.
      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: services/data-ingestion/go.mod
      - name: Build Go modules
        if: matrix.language == 'go'
        run: |
          find . -type f -name go.mod -not -path './.git/*' -not -path '*/vendor/*' \
            -exec dirname {} \; | sort -u | while IFS= read -r mod; do
              echo "::group::build $mod"
              ( cd "$mod" && go build ./... )
              echo "::endgroup::"
          done

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:${{matrix.language}}"
