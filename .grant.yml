# Grant License Compliance Configuration
# Complete configuration file with all available options
# See: https://github.com/anchore/grant

format: table
quiet: false
verbose: true

require-license: true
require-known-license: true

allow:
  - 0BSD
  - Apache-*
  - BSD-*-Clause
  - BSD-2-Clause-Patent
  - BSD-2-Clause-FreeBSD
  - BSD-2-Clause-NetBSD
  - BSD-2-Clause-Views
  - BSD-3-Clause-Attribution
  - BSD-3-Clause-Clear
  - BSD-3-Clause-Modification
  - ISC
  - MIT
  - MIT-Modern-Variant
  - Unlicense
  - Zlib
  - CC0-*
  - BSL-1.0

# Note: Syfts SBOM does currently not contain license information for github actions
ignore-packages:
  # actions/* is licensed under MIT
  - actions/*

  # github/codeql-action/* licensed under MIT
  - github/codeql-action/*

  # amannn/action-semantic-pull-request licensed under MIT
  - amannn/action-semantic-pull-request

  # fsfe/reuse-action licensed under CC0-1.0
  - fsfe/reuse-action

  # golangci/golangci-lint-action licensed under MIT
  - golangci/golangci-lint-action
  # golang/govulncheck-action licensed under BSD 3-Clause
  - golang/govulncheck-action

  # marocchino/sticky-pull-request-comment licensed under MIT
  - marocchino/sticky-pull-request-comment

  # ossf/scorecard-action licensed under Apache-2.0
  - ossf/scorecard-action

  # anchore/sbom-action licensed under Apache-2.0
  - anchore/sbom-action
  # anchore/scan-action licensed under MIT
  - anchore/scan-action

  # pnpm/action-setup licensed under MIT
  - pnpm/action-setup

  # zizmorcore/zizmor-action licensed under MIT
  - zizmorcore/zizmor-action

  # bufbuild/buf-action licensed under Apache-2.0
  - bufbuild/buf-action

  # Exclude github.com/operational-context-graph/* due to being our own packages
  - github.com/operational-context-graph/*

  # github.com/coreos/go-semver is Apache-2.0; Syft also emits a LicenseRef-* hash
  # from the bundled NOTICE file, which grant cannot resolve to a known SPDX ID.
  # Pulled in transitively by github.com/go-mysql-org/go-mysql.
  - github.com/coreos/go-semver

  # modernc.org/{sqlite,libc,memory} are BSD-3-Clause/MIT; Syft emits additional
  # LicenseRef-* hashes from bundled LICENSE-3RD-PARTY.md files. These are
  # test-only transitive dependencies pulled in via github.com/pressly/goose/v3.
  - modernc.org/libc
  - modernc.org/memory
  - modernc.org/sqlite
