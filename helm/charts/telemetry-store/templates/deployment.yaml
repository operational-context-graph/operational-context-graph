apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "telemetry-store.fullname" . }}
  labels:
    {{- include "telemetry-store.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "telemetry-store.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "telemetry-store.selectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: In
                      values:
                        - {{ include "telemetry-store.name" . }}
                topologyKey: "kubernetes.io/hostname"
      initContainers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/usr/local/bin/migrate"]
          env:
            - name: DORIS_REPLICATION_NUM
              value: {{ .Values.env.DORIS_REPLICATION_NUM | quote }}
            - name: DORIS_BUCKETS
              value: {{ .Values.env.DORIS_BUCKETS | quote }}
            - name: DORIS_DATABASE
              value: {{ .Values.env.DORIS_DATABASE | quote }}
          envFrom:
            - secretRef:
                name: {{ .Values.dorisReadSecretName }}
            - secretRef:
                name: {{ .Values.dorisSecretName }}
      containers:
        - name: {{ .Chart.Name }}
          image: {{ include "telemetry-store.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
              protocol: TCP
            - name: metrics
              containerPort: {{ .Values.metricsPort }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          envFrom:
            - secretRef:
                name: {{ .Values.dorisSecretName }}
            - secretRef:
                name: {{ .Values.dorisReadSecretName }}
          env:
            - name: HTTP_PORT
              value: {{ .Values.env.HTTP_PORT | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.env.LOG_LEVEL | quote }}
            - name: DORIS_DATABASE
              value: {{ .Values.env.DORIS_DATABASE | quote }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
